---
site_name: AAP Mesh Node Addition
site_description: Add execution and hop nodes to containerized AAP without re-running the full installer
site_author: Phil Griffiths
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search
  - tags

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation:
      - Getting Started: GETTING_STARTED.md
      - Quick Reference: INSTALL.md
      - Pick Your Topology: QUICKSTART.md
      - Offline Installation: OFFLINE.md
      - Execution Node Prep: EXECUTION_NODE.md
      - FAQ: FAQ.md
  - Examples:
      - Inventory Examples: INVENTORY_EXAMPLES.md
      - Topology Patterns: TOPOLOGY.md
  - Architecture:
      - Overview: ARCHITECTURE.md
      - Structure: STRUCTURE.md
      - Collection Map: COLLECTION_MAP.md
      - Topology: TOPOLOGY.md
  - Reference:
      - Conventions: CONVENTIONS.md
      - Troubleshooting: TROUBLESHOOTING.md
      - Findings: FINDINGS.md
