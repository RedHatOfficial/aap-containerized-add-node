---
site_name: AAP Mesh Node Addition
site_description: Add execution and hop nodes to containerized AAP without re-running the full installer
site_author: Phil Griffiths
docs_dir: docs_site

theme:
  name: material
  palette:
    - scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search
  - tags

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation:
      - Getting Started: installation/getting-started.md
      - Quick Reference: installation/INSTALL.md
      - Pick Your Topology: installation/QUICKSTART.md
      - Offline Installation: installation/OFFLINE.md
      - Execution Node Prep: installation/execution-node.md
      - FAQ: installation/FAQ.md
  - Examples:
      - Inventory Examples: examples/inventory-examples.md
      - Topology Patterns: examples/topologies.md
  - Collection:
      - Structure: collection/structure.md
      - Conventions: collection/CONVENTIONS.md
      - Troubleshooting: collection/TROUBLESHOOTING.md
