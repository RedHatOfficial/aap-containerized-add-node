---
# Optional operator overrides — do NOT put these in the installer inventory.
# ansible-playbook playbooks/add_node.yml \
#   -i /path/to/aap-setup/inventory \
#   -e aap_setup_dir=/path/to/aap-setup \
#   -e @examples/add_node.secrets.yml
#
# Discover / register / verify all use awx-manage on the controller
# (SSH access to automationcontroller is required). No gateway token needed.

# Optional overrides (normally fetched from first automationcontroller host)
# aap_add_node_mesh_ca_cert: /secure/mesh-CA.crt
# aap_add_node_mesh_ca_key: /secure/mesh-CA.key
# aap_add_node_work_public_key: /secure/work_public_key.pem

# Prefer new node dialing out to an existing hop (set per-host in installer inventory
# via receptor_peers / aap_add_node_peers). Keep false to avoid editing controller receptor.conf.
aap_add_node_peers_from_control_nodes: false

# Optional: fail host_prep when receptor image tag differs from an existing EN.
# aap_add_node_fail_on_version_skew: true

# Lab re-runs: skip bundle image copy/extract/import when images already loaded
# aap_add_node_skip_image_load: true
