---
# Single hop node peering to controller
#
# Topology: HN → Controller
# Use case: Prepare for future ENs behind this hop
#
# ┌─────────────────┐
# │   Controller    │
# │ controller.com  │◄─────────────────┐
# │   [listener]    │                  │
# └─────────────────┘                  │
#                               outbound dial
#                                      │
#                               ┌──────┴────────┐
#                               │     Hop       │
#                               │  hop-01.com   │
#                               │  [dials out]  │
#                               └───────────────┘

all:
  children:
    automationcontroller:
      hosts:
        controller.example.com:

    execution_nodes:
      hosts:
        hop-01.example.com:
          receptor_type: hop
          receptor_peers:
            - controller.example.com
          routable_hostname: hop-01.example.com

  vars:
    ansible_user: ansible
    aap_setup_dir: /path/to/ansible-automation-platform-containerized-setup-2.x
