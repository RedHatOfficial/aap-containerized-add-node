---
# Multiple execution nodes peering directly to controller
#
# Topology: EN1 → Controller
#           EN2 → Controller
# Use case: Scale out execution capacity

all:
  children:
    automationcontroller:
      hosts:
        controller.example.com:

    execution_nodes:
      hosts:
        exec-01.example.com:
          receptor_type: execution
          receptor_peers:
            - controller.example.com
          routable_hostname: exec-01.example.com

        exec-02.example.com:
          receptor_type: execution
          receptor_peers:
            - controller.example.com
          routable_hostname: exec-02.example.com

        exec-03.example.com:
          receptor_type: execution
          receptor_peers:
            - controller.example.com
          routable_hostname: exec-03.example.com

  vars:
    ansible_user: ansible
    aap_setup_dir: /path/to/ansible-automation-platform-containerized-setup-2.x
