---
# Single execution node peering directly to controller
#
# Topology: EN → Controller
# Use case: Simple setup, single site

all:
  children:
    automationcontroller:
      hosts:
        controller.example.com:

    execution_nodes:
      hosts:
        exec-01.example.com:
          receptor_type: execution
          receptor_peers:
            - controller.example.com
          routable_hostname: exec-01.example.com

  vars:
    ansible_user: ansible
    aap_setup_dir: /path/to/ansible-automation-platform-containerized-setup-2.x
