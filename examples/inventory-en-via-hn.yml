---
# Execution node behind hop node (multi-hop)
#
# Topology: EN → HN → Controller
# Use case: Remote site with hop relay

all:
  children:
    automationcontroller:
      hosts:
        controller.example.com:

    execution_nodes:
      hosts:
        # Hop node peers to controller
        hop-01.example.com:
          receptor_type: hop
          receptor_peers:
            - controller.example.com
          routable_hostname: hop-01.example.com

        # Execution node peers to hop (not controller)
        exec-01.example.com:
          receptor_type: execution
          receptor_peers:
            - hop-01.example.com
          routable_hostname: exec-01.example.com

  vars:
    ansible_user: ansible
    aap_setup_dir: /path/to/ansible-automation-platform-containerized-setup-2.x
