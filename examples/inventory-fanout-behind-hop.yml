---
# Multiple execution nodes behind single hop
#
# Topology: EN1 → HN → Controller
#           EN2 → HN → Controller
# Use case: Remote site with multiple workers
#
# ┌─────────────────┐
# │   Controller    │
# │ controller.com  │◄─────────────────┐
# │   [listener]    │                  │
# └─────────────────┘                  │
#                               outbound dial
#                                      │
#                               ┌──────┴────────┐
#               ┌──────────────►│     Hop       │◄──────────────┐
#               │               │  hop-01.com   │               │
#               │               │   [listener]  │               │
#               │               └───────────────┘               │
#               │                                               │
#        outbound dial                                   outbound dial
#               │                                               │
#        ┌──────┴──────┐                                 ┌──────┴──────┐
#        │  Execution  │                                 │  Execution  │
#        │ exec-01.com │                                 │ exec-02.com │
#        │ [dials out] │                                 │ [dials out] │
#        └─────────────┘                                 └─────────────┘

all:
  children:
    automationcontroller:
      hosts:
        controller.example.com:

    execution_nodes:
      hosts:
        # Hop node peers to controller
        hop-01.example.com:
          receptor_type: hop
          receptor_peers:
            - controller.example.com
          routable_hostname: hop-01.example.com

        # Both ENs peer to the same hop
        exec-01.example.com:
          receptor_type: execution
          receptor_peers:
            - hop-01.example.com
          routable_hostname: exec-01.example.com

        exec-02.example.com:
          receptor_type: execution
          receptor_peers:
            - hop-01.example.com
          routable_hostname: exec-02.example.com

  vars:
    ansible_user: ansible
    aap_setup_dir: /path/to/ansible-automation-platform-containerized-setup-2.x
