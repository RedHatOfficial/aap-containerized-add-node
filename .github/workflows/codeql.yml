---
# CodeQL requires GitHub Advanced Security (enterprise feature)
# This workflow will fail on repos without GHAS enabled
# To enable: Settings → Security → Code security and analysis → Enable
name: CodeQL

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 6am UTC

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    # Skip if Advanced Security not available
    if: github.repository_owner == 'RedHatOfficial'
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [python]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
