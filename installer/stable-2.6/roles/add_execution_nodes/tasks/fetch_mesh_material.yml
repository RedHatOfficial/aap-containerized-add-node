---

- name: Ensure local material directory
  ansible.builtin.file:
    path: "{{ add_execution_nodes_material_dir }}"
    state: directory
    mode: '0700'

- name: Fetch mesh material from controller when overrides unset
  vars:
    _mesh_src_host: "{{ groups['automationcontroller'][0] }}"
    _mesh_delegate_connection: "{{ hostvars[_mesh_src_host].ansible_connection | default('ssh') }}"
    _needs_fetch: >-
      {{
        (add_execution_nodes_mesh_ca_cert | default('') | length == 0)
        or (add_execution_nodes_mesh_ca_key | default('') | length == 0)
        or (add_execution_nodes_work_public_key | default('') | length == 0)
      }}
  block:
    - name: Query remote install-user home
      ansible.builtin.shell: echo "$HOME"
      register: _add_en_ctrl_home
      delegate_to: "{{ _mesh_src_host }}"
      connection: "{{ _mesh_delegate_connection }}"
      become: false
      changed_when: false
      when: _needs_fetch | bool

    - name: Fetch mesh CA certificate from controller
      ansible.builtin.fetch:
        src: "{{ _add_en_ctrl_home.stdout }}/{{ add_execution_nodes_remote_mesh_ca_cert }}"
        dest: "{{ add_execution_nodes_material_dir }}/mesh-CA.crt"
        flat: true
      delegate_to: "{{ _mesh_src_host }}"
      connection: "{{ _mesh_delegate_connection }}"
      become: false
      when:
        - _needs_fetch | bool
        - add_execution_nodes_mesh_ca_cert | default('') | length == 0

    - name: Fetch mesh CA key from controller
      ansible.builtin.fetch:
        src: "{{ _add_en_ctrl_home.stdout }}/{{ add_execution_nodes_remote_mesh_ca_key }}"
        dest: "{{ add_execution_nodes_material_dir }}/mesh-CA.key"
        flat: true
      delegate_to: "{{ _mesh_src_host }}"
      connection: "{{ _mesh_delegate_connection }}"
      become: false
      no_log: true
      when:
        - _needs_fetch | bool
        - add_execution_nodes_mesh_ca_key | default('') | length == 0

    - name: Fetch work signing public key from controller
      ansible.builtin.fetch:
        src: "{{ _add_en_ctrl_home.stdout }}/{{ add_execution_nodes_remote_work_public_key }}"
        dest: "{{ add_execution_nodes_material_dir }}/work_public_key.pem"
        flat: true
      delegate_to: "{{ _mesh_src_host }}"
      connection: "{{ _mesh_delegate_connection }}"
      become: false
      when:
        - _needs_fetch | bool
        - add_execution_nodes_work_public_key | default('') | length == 0

- name: Enforce mesh CA key permissions
  ansible.builtin.file:
    path: "{{ add_execution_nodes_material_dir }}/mesh-CA.key"
    mode: '0400'
  when: add_execution_nodes_mesh_ca_key | default('') | length == 0

- name: Enforce mesh CA cert permissions
  ansible.builtin.file:
    path: "{{ add_execution_nodes_material_dir }}/mesh-CA.crt"
    mode: '0640'
  when: add_execution_nodes_mesh_ca_cert | default('') | length == 0

- name: Enforce work public key permissions
  ansible.builtin.file:
    path: "{{ add_execution_nodes_material_dir }}/work_public_key.pem"
    mode: '0640'
  when: add_execution_nodes_work_public_key | default('') | length == 0

- name: Set local material paths
  ansible.builtin.set_fact:
    _add_en_mesh_ca_cert: "{{ add_execution_nodes_mesh_ca_cert if (add_execution_nodes_mesh_ca_cert | default('') | length) else add_execution_nodes_material_dir ~ '/mesh-CA.crt' }}"
    _add_en_mesh_ca_key: "{{ add_execution_nodes_mesh_ca_key if (add_execution_nodes_mesh_ca_key | default('') | length) else add_execution_nodes_material_dir ~ '/mesh-CA.key' }}"
    _add_en_work_public_key: "{{ add_execution_nodes_work_public_key if (add_execution_nodes_work_public_key | default('') | length) else add_execution_nodes_material_dir ~ '/work_public_key.pem' }}"

- name: Publish fetched mesh material paths on control host
  ansible.builtin.add_host:
    name: add_execution_nodes_control
    groups: add_execution_nodes_control
    add_execution_nodes_has_work: "{{ hostvars['add_execution_nodes_control'].add_execution_nodes_has_work | default(false) }}"
    add_execution_nodes_mesh_ca_cert: "{{ _add_en_mesh_ca_cert }}"
    add_execution_nodes_mesh_ca_key: "{{ _add_en_mesh_ca_key }}"
    add_execution_nodes_work_public_key: "{{ _add_en_work_public_key }}"
