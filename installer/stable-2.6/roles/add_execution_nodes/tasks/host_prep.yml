---

- name: Ensure non-root install user
  ansible.builtin.assert:
    that:
      - ansible_user_uid | int != 0
    fail_msg: Containerized AAP nodes must be managed as a non-root user.

- name: Decide whether to skip installer image copy/load
  ansible.builtin.import_tasks: image_skip.yml

# Reuse installer inventory variables where present ([all:vars] / per-host).
# Only inject playbook-specific values: mesh CA cert path (prevents new CA generation)
# and image-skip overrides.
- name: Set installer common vars for this node
  ansible.builtin.set_fact:
    bundle_install: >-
      {{ false if (add_execution_nodes_skip_image_load_effective | bool)
         else (bundle_install | default(false)) }}
    bundle_dir: "{{ bundle_dir | default(add_execution_nodes_setup_dir ~ '/bundle') }}"
    ca_tls_cert: "{{ hostvars['add_execution_nodes_control'].add_execution_nodes_mesh_ca_cert }}"
    container_pull_images: "{{ false if (add_execution_nodes_skip_image_load_effective | bool) else (container_pull_images | default(true)) }}"
    registry_auth: "{{ false if (add_execution_nodes_skip_image_load_effective | bool) else (registry_auth | default(true)) }}"

- name: Run containerized installer common role on new host
  ansible.builtin.import_role:
    name: common
