---
# Post-join list_instances assertion for execution_nodes_new.

- name: List instances via awx-manage on controller
  ansible.builtin.import_tasks: list_instances.yml

- name: Assert each new hostname appears in list_instances
  ansible.builtin.assert:
    that:
      - _hostname in add_execution_nodes_existing_hostnames
    fail_msg: "Instance '{{ _hostname }}' not found in awx-manage list_instances output."
    success_msg: "Found '{{ _hostname }}' in Controller instance list."
  loop: "{{ groups[add_execution_nodes_target_group] | default([]) }}"
  when: (groups[add_execution_nodes_target_group] | default([])) | length > 0
  vars:
    _hostname: "{{ hostvars[item].routable_hostname | default(item) }}"

- name: Warn when a new hostname is registered but has no heartbeat yet
  ansible.builtin.debug:
    msg: >-
      '{{ hostvars[item].routable_hostname | default(item) }}' is registered but has no
      heartbeat in list_instances yet (mesh/health may still be catching up).
  loop: "{{ groups[add_execution_nodes_target_group] | default([]) }}"
  when:
    - (groups[add_execution_nodes_target_group] | default([])) | length > 0
    - (hostvars[item].routable_hostname | default(item)) not in (add_execution_nodes_ready_hostnames | default([]))

- name: Show list_instances excerpt for verification
  ansible.builtin.debug:
    var: add_execution_nodes_list_instances_stdout
  when: (groups[add_execution_nodes_target_group] | default([])) | length > 0
