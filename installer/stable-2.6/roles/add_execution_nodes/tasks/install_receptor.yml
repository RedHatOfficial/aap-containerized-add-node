---
# Per-host receptor_* and bundle_* come from the installer inventory.

- name: Place public CA for mesh-CA template
  ansible.builtin.copy:
    src: "{{ add_execution_nodes_bundle_dir }}/receptor/tls/ca/mesh-CA.crt"
    dest: "{{ ansible_user_dir }}/aap/tls/ca.cert"
    mode: '0640'

- name: Set receptor role vars (installer receptor role + minted certs)
  ansible.builtin.set_fact:
    routable_hostname: "{{ _hostname }}"
    _ca_tls_dir: "{{ ansible_user_dir }}/aap/tls"
    _receptor_image: "{{ _computed_image }}"
    receptor_tls_cert: "{{ add_execution_nodes_bundle_dir }}/receptor/tls/receptor.crt"
    receptor_tls_key: "{{ add_execution_nodes_bundle_dir }}/receptor/tls/receptor.key"
    receptor_type: "{{ _node_type }}"
    receptor_port: "{{ receptor_port | default(add_execution_nodes_listener_port) }}"
    receptor_peers: "{{ receptor_peers | default([]) }}"
    bundle_install: "{{ bundle_install | default(false) }}"
    receptor_disable_signing: "{{ _node_type == 'hop' }}"
    receptor_signing_public_key: "{{ (add_execution_nodes_bundle_dir ~ '/receptor/work_public_key.pem') if _node_type == 'execution' else omit }}"
    receptor_signing_private_key: "{{ (add_execution_nodes_bundle_dir ~ '/receptor/work_public_key.pem') if _node_type == 'execution' else omit }}"
  vars:
    _hostname: "{{ routable_hostname | default(inventory_hostname) }}"
    _node_type: "{{ receptor_type | default('execution') }}"
    _registry_url: "{{ registry_url | default('registry.redhat.io') }}"
    _registry_ns: "{{ registry_ns_aap | default(add_execution_nodes_default_registry_ns_aap) }}"
    _receptor_img: "{{ receptor_image | default(add_execution_nodes_default_receptor_image) }}"
    _computed_image: "{{ _registry_url ~ '/' ~ _registry_ns ~ '/' ~ _receptor_img }}"

- name: Seed receptor dial facts on peer inventory hosts
  ansible.builtin.set_fact:
    _receptor_hostname: "{{ _dial }}"
    _receptor_port: "{{ hostvars[item].receptor_port | default(hostvars[item].listener_port | default(add_execution_nodes_listener_port)) }}"
    _receptor_protocol: "{{ hostvars[item].receptor_protocol | default('tcp') }}"
  delegate_to: "{{ item }}"
  connection: "{{ hostvars[item].ansible_connection | default('ssh') }}"
  delegate_facts: true
  when: item in hostvars
  loop: "{{ receptor_peers | default([]) }}"
  vars:
    _dial: >-
      {{ hostvars[item].receptor_address
         | default(hostvars[item].ansible_default_ipv4.address
         | default(hostvars[item].ansible_host
         | default(hostvars[item].routable_hostname
         | default(item)))) }}

- name: Install receptor container via installer role
  ansible.builtin.import_role:
    name: receptor
