---
# Run awx-manage list_instances on automationcontroller[0].

- name: Resolve controller host for awx-manage
  ansible.builtin.set_fact:
    add_execution_nodes_controller_host: "{{ groups['automationcontroller'][0] }}"

- name: Ensure controller task container is running
  ansible.builtin.import_tasks: assert_controller.yml

- name: List instances via awx-manage
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - -e
      - NO_COLOR=1
      - -e
      - TERM=dumb
      - -e
      - PY_COLORS=0
      - "{{ add_execution_nodes_controller_container }}"
      - awx-manage
      - list_instances
  delegate_to: "{{ add_execution_nodes_controller_host }}"
  connection: "{{ hostvars[add_execution_nodes_controller_host].ansible_connection | default('ssh') }}"
  become: false
  register: _add_en_list_instances
  changed_when: false

- name: Publish list_instances stdout and parsed hostnames
  ansible.builtin.set_fact:
    add_execution_nodes_list_instances_stdout: "{{ _stdout }}"
    add_execution_nodes_existing_hostnames: "{{ (_stdout | regex_findall(_hostname_re) | default([], true)) | unique | list }}"
    add_execution_nodes_ready_hostnames: "{{ (_stdout | regex_findall(_ready_re) | default([], true)) | unique | list }}"
  vars:
    _stdout: "{{ _add_en_list_instances.stdout | regex_replace('\\x1b\\[[0-9;]*[A-Za-z]', '') }}"
    _hostname_re: '(?m)^\s*(?:\[DISABLED\]\s+)?(\S+)\s+(?:capacity=\d+\s+)?node_type='
    _ready_re: '(?m)^\s+(?!\[DISABLED\])(\S+)\s+.*\bheartbeat='
