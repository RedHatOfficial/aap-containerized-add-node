---
# add_execution_nodes playbook knobs only. Installer inventory ([all:vars], per-host EN/HN) supplies
# bundle_install, bundle_dir, registry_*, receptor_*, routable_hostname, etc.

add_execution_nodes_inventory_group: execution_nodes
add_execution_nodes_target_group: execution_nodes_new
add_execution_nodes_controller_container: automation-controller-task
add_execution_nodes_listener_port: 27199
add_execution_nodes_awx_manage_retries: 5
add_execution_nodes_awx_manage_delay: 15
add_execution_nodes_enable_controller_listener: true
add_execution_nodes_preflight_enabled: true
add_execution_nodes_preflight_timeout: 10
add_execution_nodes_serial_receptor: 1
add_execution_nodes_enable_controller_peer: false

# Fallback setup-tree paths when inventory omits bundle_dir (run playbook from setup root).
add_execution_nodes_setup_dir: "{{ playbook_dir }}/../../../../../"
add_execution_nodes_bundle_root: "{{ bundle_dir | default(add_execution_nodes_setup_dir ~ '/bundle') | dirname }}/bundles"
add_execution_nodes_material_dir: "{{ add_execution_nodes_bundle_root }}/_mesh_material"
add_execution_nodes_tls_bits: 4096
add_execution_nodes_skip_image_load: false
add_execution_nodes_skip_image_load_if_present: true

# Last-resort image naming when [all:vars] omits registry_ns_aap / receptor_image (2.6 setup).
add_execution_nodes_default_registry_ns_aap: ansible-automation-platform-26
add_execution_nodes_default_receptor_image: receptor-rhel9:latest
add_execution_nodes_default_ee_minimal_image: ee-minimal-rhel9:latest

# Optional overrides; leave empty to fetch from controller at runtime.
add_execution_nodes_remote_mesh_ca_cert: aap/receptor/etc/mesh-CA.crt
add_execution_nodes_remote_mesh_ca_key: aap/tls/ca.key
add_execution_nodes_remote_work_public_key: aap/receptor/etc/signing_public.pem
add_execution_nodes_mesh_ca_cert: ''
add_execution_nodes_mesh_ca_key: ''
add_execution_nodes_work_public_key: ''
