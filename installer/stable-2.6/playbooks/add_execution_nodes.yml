---
# Add execution/hop nodes to an existing containerized mesh without re-running install.
#
#   ansible-playbook -i inventory-growth ansible.containerized_installer.add_execution_nodes
#
# Outbound dial (receptor_peers on new nodes) is the default — no mesh disruption on
# existing controllers/hops. Opt-in inbound dial: -e add_execution_nodes_enable_controller_peer=true

- name: Preflight checks (skip with -e add_execution_nodes_preflight_enabled=false)
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Run preflight
      ansible.builtin.import_role:
        name: add_execution_nodes
        tasks_from: preflight.yml

- name: Discover execution_nodes missing from Controller
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Discover net-new / incomplete EN and HN hosts
      ansible.builtin.import_role:
        name: add_execution_nodes
        tasks_from: discover.yml

- name: Fetch mesh CA and work public key from controller
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Fetch mesh material
      ansible.builtin.import_role:
        name: add_execution_nodes
        tasks_from: fetch_mesh_material.yml
      when: hostvars['add_execution_nodes_control'].add_execution_nodes_has_work | default(false) | bool

- name: Enable mesh listener on automationcontroller when local-only
  hosts: automationcontroller
  gather_facts: true
  become: false
  tasks:
    - name: Flip local-only to tcp-listener if needed
      ansible.builtin.import_role:
        name: add_execution_nodes
        tasks_from: enable_controller_listener.yml
      when: hostvars['add_execution_nodes_control'].add_execution_nodes_has_work | default(false) | bool

- name: Host preparation on new nodes only
  hosts: execution_nodes_new
  become: false
  gather_facts: true
  any_errors_fatal: true
  tasks:
    - name: Prepare new hosts via installer common role
      ansible.builtin.import_role:
        name: add_execution_nodes
        tasks_from: host_prep.yml
      when: (groups['execution_nodes_new'] | default([])) | length > 0

- name: Mint receptor certificates for each new node
  hosts: execution_nodes_new
  gather_facts: false
  tasks:
    - name: Mint certs on ansible control host
      ansible.builtin.include_role:
        name: add_execution_nodes
        tasks_from: mint_certs.yml
        apply:
          delegate_to: localhost
          become: false
      when: (groups['execution_nodes_new'] | default([])) | length > 0

- name: Register new instances via awx-manage on controller
  hosts: execution_nodes_new
  serial: 1
  gather_facts: true
  become: false
  tasks:
    - name: Register EN/HN instances
      ansible.builtin.import_role:
        name: add_execution_nodes
        tasks_from: register.yml
      when: (groups['execution_nodes_new'] | default([])) | length > 0

- name: Install and configure receptor on new nodes
  hosts: execution_nodes_new
  serial: "{{ add_execution_nodes_serial_receptor | default(1) }}"
  become: false
  gather_facts: true
  tasks:
    - name: Install receptor via installer role
      ansible.builtin.import_role:
        name: add_execution_nodes
        tasks_from: install_receptor.yml
      when: (groups['execution_nodes_new'] | default([])) | length > 0

- name: Update controller peers (CAUSES MESH DISRUPTION - skip unless inbound dial needed)
  hosts: automationcontroller
  gather_facts: true
  tasks:
    - name: Add inbound tcp-peer entries on controller
      ansible.builtin.import_role:
        name: add_execution_nodes
        tasks_from: update_controller_peers.yml
      when:
        - add_execution_nodes_enable_controller_peer | default(false) | bool
        - hostvars['add_execution_nodes_control'].add_execution_nodes_has_work | default(false) | bool

- name: Verify new instances appear in list_instances
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Verify join
      ansible.builtin.import_role:
        name: add_execution_nodes
        tasks_from: verify.yml
      when: hostvars['add_execution_nodes_control'].add_execution_nodes_has_work | default(false) | bool
