---
- name: Provision vms
  environment:
    ANSIBLE_LOG_PATH: "{{ artifacts_dest_base_dir }}/provision_vms.log"
  ansible.builtin.shell:
    cmd: |
      ansible-playbook aapqa.onprem_provisioner.provision \
        -e provisioner_prefix='{{ provision_prefix }}' \
        -e @{{ provision_cloud }} \
        -e @{{ provision_topology }} \
        -e @{{ provision_platform }} \
        -e @input/provisioner/flavors/large_disk.yml \
        -e @input/provisioner/hooks/ansible_jenkins.yml {{ provision_extra_args | default('') }} \
        -e @input/provisioner/rhsm/disable.yml
    chdir: "/tmp/aapqa-provisioner"
  changed_when: false

- name: Copy provision inventory file
  ansible.builtin.copy:
    remote_src: true
    src: "/tmp/aapqa-provisioner/provisioner_inventory_{{ provision_prefix }}"
    dest: "{{ ansible_env.PWD }}/provisioner_inventory_{{ provision_prefix }}"
    mode: '0640'
...
