---
- name: Initialize the ansible lightspeed database
  containers.podman.podman_container:
    name: ansible-lightspeed-init
    image: '{{ _lightspeed_image }}'
    command: 'wisdom-manage migrate --noinput'
    detach: false
    rm: true
    log_driver: '{{ container_log_driver }}'
    user: '{{ ansible_user_uid }}'
    userns: keep-id
    network: host
    mount:
      - 'type=tmpfs,destination=/etc/ansible/tmp,U=true'
    secrets: '{{ _common_secrets }}'
    volume: '{{ _lightspeed_volumes }}'
    env: '{{ _lightspeed_env }}'
  register: _migrate
  changed_when: "'No migrations to apply' not in _migrate.stdout"
  run_once: true
  retries: 5
  delay: 60
  until: _migrate is not failed

- name: Create django super user
  containers.podman.podman_container:
    name: ansible-lightspeed-init
    image: '{{ _lightspeed_image }}'
    command: 'wisdom-manage createsuperuser --username={{ lightspeed_admin_user }} --email={{ lightspeed_admin_email }} --noinput'
    detach: false
    rm: true
    log_driver: '{{ container_log_driver }}'
    user: '{{ ansible_user_uid }}'
    userns: keep-id
    network: host
    mount:
      - 'type=tmpfs,destination=/etc/ansible/tmp,U=true'
    secrets: '{{ _common_secrets }}'
    volume: '{{ _lightspeed_volumes }}'
    env: '{{ _lightspeed_env }}'
  register: _createsuperuser
  changed_when: "'Superuser created successfully' in _createsuperuser.stdout"
  failed_when: false
  run_once: true
  retries: 5
  delay: 60
  until: _createsuperuser is not failed

- name: Initialise the lightspeed chatbot rag content
  containers.podman.podman_container:
    name: ansible-lightspeed-chatbot-init
    image: '{{ _lightspeed_chatbot_image }}'
    command: "/rag/entrypoint.sh"
    detach: false
    rm: true
    log_driver: '{{ container_log_driver }}'
    user: '{{ ansible_user_uid }}'
    userns: keep-id
    network: host
    secrets: '{{ _lightspeed_chatbot_secrets }}'
    volume: '{{ _lightspeed_chatbot_volumes }}'
    env: '{{ _lightspeed_chatbot_env }}'
  register: _chatbot_rag_init
  changed_when: >
    ('Latest vector database file has been installed.' in _chatbot_rag_init.stdout) or
    ('Latest embeddings model has been installed.' in _chatbot_rag_init.stdout)
  failed_when: false
  retries: 5
  delay: 60
  until: _chatbot_rag_init is not failed
  when: lightspeed_chatbot_model_url is defined

- name: Get current BYOK image digest
  containers.podman.podman_image_info:
    name: '{{ lightspeed_chatbot_byok_image }}'
  register: _byok_image_info
  when:
    - lightspeed_chatbot_model_url is defined
    - lightspeed_chatbot_byok_image is defined

- name: Set BYOK image digest fact
  ansible.builtin.set_fact:
    _byok_current_digest: '{{ _byok_image_info.images | map(attribute="Id") | first }}'
  when:
    - lightspeed_chatbot_model_url is defined
    - lightspeed_chatbot_byok_image is defined

- name: Initialise the lightspeed chatbot BYOK vector database
  containers.podman.podman_container:
    name: ansible-lightspeed-chatbot-byok-init
    image: '{{ lightspeed_chatbot_byok_image }}'
    command:
      - sh
      - '-c'
      - >-
        DIGEST_FILE="/.llama/data/byok/.image_digest";
        SAVED_DIGEST="";
        if [ -f "$DIGEST_FILE" ]; then
          SAVED_DIGEST=$(cat "$DIGEST_FILE");
        fi;
        if [ "$SAVED_DIGEST" != "$CURRENT_DIGEST" ]; then
          echo "Extracting BYOK database (digest changed or first run)";
          mkdir -p ${BYOK_CONFIG_CHATBOT_DIR} &&
          set -o pipefail &&
          sed -n 's/.*vector_store_id: //p' /rag/vector_db/llama-stack.yaml |
          tr -d '\n' > ${BYOK_CONFIG_CHATBOT_DIR}/provider_vector_db_id.ind &&
          gzip -cd /rag/vector_db/faiss_store.db.gz > ${BYOK_CONFIG_CHATBOT_DIR}/faiss_store.db &&
          echo "$CURRENT_DIGEST" > "$DIGEST_FILE" &&
          echo "BYOK vector database extracted successfully";
        else
          echo "BYOK database unchanged, skipping extraction";
        fi
    pull: never
    detach: false
    rm: true
    log_driver: '{{ container_log_driver }}'
    user: '{{ ansible_user_uid }}'
    userns: keep-id
    network: host
    volume: '{{ _lightspeed_chatbot_volumes }}'
    env:
      BYOK_CONFIG_CHATBOT_DIR: '/.llama/data/byok/distributions/ansible-chatbot'
      CURRENT_DIGEST: '{{ _byok_current_digest }}'
  register: _chatbot_byok_init
  changed_when: "'BYOK vector database extracted successfully' in _chatbot_byok_init.stdout"
  notify: Restart lightspeed chatbot
  retries: 5
  delay: 60
  until: _chatbot_byok_init is not failed
  when:
    - lightspeed_chatbot_model_url is defined
    - lightspeed_chatbot_byok_image is defined
...
