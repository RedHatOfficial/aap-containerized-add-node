---
# Uses routable_hostname / receptor_type from installer inventory.

- name: Mint receptor TLS bundle
  vars:
    _hostname: "{{ routable_hostname | default(inventory_hostname) }}"
    _node_type: "{{ receptor_type | default('execution') }}"
    _bundle_dir: "{{ add_execution_nodes_bundle_root }}/{{ _hostname }}"
    _mesh_ca_cert: "{{ hostvars['add_execution_nodes_control'].add_execution_nodes_mesh_ca_cert }}"
    _mesh_ca_key: "{{ hostvars['add_execution_nodes_control'].add_execution_nodes_mesh_ca_key }}"
    _work_pub: "{{ hostvars['add_execution_nodes_control'].add_execution_nodes_work_public_key | default('') }}"
  block:
    - name: Create bundle directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0750'
      loop:
        - "{{ _bundle_dir }}/receptor/tls/ca"
        - "{{ _bundle_dir }}/receptor/tls"

    - name: Copy mesh CA certificate into bundle
      ansible.builtin.copy:
        src: "{{ _mesh_ca_cert }}"
        dest: "{{ _bundle_dir }}/receptor/tls/ca/mesh-CA.crt"
        mode: '0640'

    - name: Copy work signing public key into bundle
      ansible.builtin.copy:
        src: "{{ _work_pub }}"
        dest: "{{ _bundle_dir }}/receptor/work_public_key.pem"
        mode: '0640'
      when:
        - _work_pub | length > 0
        - _node_type == 'execution'

    - name: Generate node private key
      community.crypto.openssl_privatekey:
        path: "{{ _bundle_dir }}/receptor/tls/receptor.key"
        size: "{{ add_execution_nodes_tls_bits | int }}"
        type: RSA
        mode: '0400'

    - name: Generate node CSR with receptor node-id SAN OID
      community.crypto.openssl_csr:
        path: "{{ _bundle_dir }}/receptor/tls/receptor.csr"
        privatekey_path: "{{ _bundle_dir }}/receptor/tls/receptor.key"
        common_name: "{{ _hostname }}"
        subject_alt_name: "{{ _sans }}"
        subject_alt_name_critical: false
      vars:
        _sans:
          - "DNS:{{ _hostname }}"
          - "otherName:1.3.6.1.4.1.2312.19.1;UTF8:{{ _hostname }}"

    - name: Sign node certificate with mesh CA
      community.crypto.x509_certificate:
        path: "{{ _bundle_dir }}/receptor/tls/receptor.crt"
        csr_path: "{{ _bundle_dir }}/receptor/tls/receptor.csr"
        ownca_path: "{{ _mesh_ca_cert }}"
        ownca_privatekey_path: "{{ _mesh_ca_key }}"
        provider: ownca
        mode: '0640'

    - name: Expose bundle paths on target host
      ansible.builtin.set_fact:
        add_execution_nodes_bundle_dir: "{{ _bundle_dir }}"
