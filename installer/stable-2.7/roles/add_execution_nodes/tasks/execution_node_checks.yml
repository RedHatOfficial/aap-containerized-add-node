---
# Per-execution-node preflight checks (_target_host from loop).

- name: "Test SSH to {{ _target_host }}"
  ansible.builtin.ping:
  delegate_to: "{{ _target_host }}"
  connection: "{{ hostvars[_target_host].ansible_connection | default('ssh') }}"
  become: false
  register: _add_en_en_ssh
  ignore_errors: true
  ignore_unreachable: true

- name: "Assert SSH to {{ _target_host }} succeeded"
  ansible.builtin.assert:
    that:
      - not (_add_en_en_ssh.unreachable | default(false) | bool)
      - _add_en_en_ssh is succeeded
    fail_msg: Cannot SSH to execution node '{{ _target_host }}'.

- name: Get controller hostname
  ansible.builtin.set_fact:
    _add_en_controller_host: "{{ groups['automationcontroller'][0] }}"

- name: "Test TCP connectivity from {{ _target_host }} to controller:{{ add_execution_nodes_listener_port }}"
  ansible.builtin.wait_for:
    host: "{{ _add_en_controller_host }}"
    port: "{{ add_execution_nodes_listener_port }}"
    timeout: "{{ add_execution_nodes_preflight_timeout }}"
    state: started
  delegate_to: "{{ _target_host }}"
  connection: "{{ hostvars[_target_host].ansible_connection | default('ssh') }}"
  become: false
  register: _add_en_en_connectivity
  ignore_errors: true
  when: hostvars[_target_host].receptor_peers | default([]) | length > 0

- name: "Warn if {{ _target_host }} cannot reach controller listener"
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ _target_host }} cannot reach {{ _add_en_controller_host }}:{{ add_execution_nodes_listener_port }}.
      This may be OK if controller enables tcp-listener later.
  when:
    - _add_en_en_connectivity is defined
    - _add_en_en_connectivity is failed

- name: "Test DNS resolution of controller from {{ _target_host }}"
  ansible.builtin.command:
    cmd: "getent hosts {{ _add_en_controller_host }}"
  delegate_to: "{{ _target_host }}"
  connection: "{{ hostvars[_target_host].ansible_connection | default('ssh') }}"
  become: false
  register: _add_en_en_dns
  changed_when: false
  failed_when: false

- name: "Assert DNS resolution works on {{ _target_host }}"
  ansible.builtin.assert:
    that:
      - _add_en_en_dns.rc == 0
    fail_msg: >-
      Cannot resolve controller hostname '{{ _add_en_controller_host }}' from {{ _target_host }}.

- name: "Get machine-id from {{ _target_host }}"
  ansible.builtin.slurp:
    src: /etc/machine-id
  delegate_to: "{{ _target_host }}"
  connection: "{{ hostvars[_target_host].ansible_connection | default('ssh') }}"
  become: false
  register: _add_en_en_machine_id

- name: "Store machine-id for {{ _target_host }}"
  ansible.builtin.set_fact:
    _preflight_machine_ids: "{{ _preflight_machine_ids | default({}) | combine({_target_host: (_add_en_en_machine_id.content | b64decode | trim)}) }}"
  delegate_to: localhost
  connection: local
  delegate_facts: true
