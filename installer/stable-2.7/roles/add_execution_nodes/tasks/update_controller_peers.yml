---
# Opt-in inbound dial (CAUSES MESH DISRUPTION). Default: false (outbound dial).

- name: Skip when inbound dial not enabled
  ansible.builtin.meta: end_host
  when: not (add_execution_nodes_enable_controller_peer | default(false) | bool)

- name: Resolve receptor config directory
  ansible.builtin.set_fact:
    add_execution_nodes_receptor_config_dir: "{{ ansible_user_dir }}/aap/receptor/etc"
  when: add_execution_nodes_receptor_config_dir | default('') | length == 0

- name: Display disruption warning
  ansible.builtin.debug:
    msg: |
      ========================================
      WARNING: INBOUND DIAL MODE ENABLED
      ========================================
      This will restart receptor on the controller.
      Expect 5-10 seconds mesh disruption.
      ========================================

- name: Backup controller receptor.conf
  ansible.builtin.fetch:
    src: "{{ add_execution_nodes_receptor_config_dir }}/receptor.conf"
    dest: "{{ playbook_dir }}/backups/{{ inventory_hostname }}_receptor.conf.{{ ansible_date_time.iso8601_basic_short }}"
    flat: true

- name: Add tcp-peer entries for new nodes
  ansible.builtin.blockinfile:
    path: "{{ add_execution_nodes_receptor_config_dir }}/receptor.conf"
    marker: "# {mark} ANSIBLE MANAGED - peer {{ item }}"
    insertbefore: "^- work-command:"
    block: |
      - tcp-peer:
          address: {{ hostvars[item].routable_hostname | default(item) }}:{{ hostvars[item].receptor_port | default(add_execution_nodes_listener_port) }}
          tls: tls_client
  loop: "{{ groups[add_execution_nodes_target_group] | default([]) }}"
  register: _add_en_receptor_conf_changed
  notify: restart receptor

- name: Force handler execution if config changed
  ansible.builtin.meta: flush_handlers
  when: _add_en_receptor_conf_changed.changed
