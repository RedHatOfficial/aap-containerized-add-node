---
# SSH + controller task container preflight (shared by preflight, list_instances, register).

- name: Require automationcontroller inventory group
  ansible.builtin.assert:
    that:
      - groups['automationcontroller'] | default([]) | length > 0
    fail_msg: Inventory must include group automationcontroller.

- name: Preflight SSH and controller task container
  vars:
    _awx_manage_host: "{{ add_execution_nodes_controller_host | default(groups['automationcontroller'][0], true) }}"
    _delegate_connection: "{{ hostvars[_awx_manage_host].ansible_connection | default('ssh') }}"
  block:
    - name: Verify SSH access to controller
      ansible.builtin.ping:
      delegate_to: "{{ _awx_manage_host }}"
      connection: "{{ _delegate_connection }}"
      become: false
      register: _add_en_ctrl_ping
      ignore_errors: true
      ignore_unreachable: true

    - name: Assert SSH to controller succeeded
      ansible.builtin.assert:
        that:
          - not (_add_en_ctrl_ping.unreachable | default(false) | bool)
          - _add_en_ctrl_ping is succeeded
        fail_msg: >-
          Cannot SSH to automationcontroller host '{{ _awx_manage_host }}'.
          Check ansible_host, SSH keys, and ProxyJump.

    - name: Inspect controller task container state
      ansible.builtin.command:
        argv:
          - podman
          - inspect
          - --format
          - "{{ '{{.State.Status}}' }}"
          - "{{ add_execution_nodes_controller_container }}"
      delegate_to: "{{ _awx_manage_host }}"
      connection: "{{ _delegate_connection }}"
      become: false
      register: _add_en_ctr_inspect
      changed_when: false
      failed_when: false

    - name: Assert controller task container is running
      ansible.builtin.assert:
        that:
          - _add_en_ctr_inspect.rc == 0
          - (_add_en_ctr_inspect.stdout | trim) == 'running'
        fail_msg: >-
          Container '{{ add_execution_nodes_controller_container }}' is not running on
          {{ _awx_manage_host }} (status={{ _add_en_ctr_inspect.stdout | default('(missing)') | trim }}).
