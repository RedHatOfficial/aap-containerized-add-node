---
- name: Generate TLS certificate and key
  when:
    - automationmetrics_tls_cert is not defined
    - automationmetrics_tls_key is not defined
  block:
    - name: Install python-cryptography
      ansible.builtin.package:
        name: python3-cryptography
      become: true
      when: not ostree | bool

    - name: Generate a private key
      community.crypto.openssl_privatekey:
        path: '{{ automationmetrics_config_path }}/automationmetrics.key'
        mode: '0400'
      notify: Restart automation metrics web

    - name: Generate a certificate signing request
      community.crypto.openssl_csr:
        path: '{{ automationmetrics_config_path }}/automationmetrics.csr'
        privatekey_path: '{{ automationmetrics_config_path }}/automationmetrics.key'
        common_name: '{{ _automationmetrics_hostname }}'
        country_name: 'US'
        locality_name: 'Raleigh'
        organization_name: 'Red Hat'
        organizational_unit_name: 'Ansible'
        state_or_province_name: 'North Carolina'
        subject_alt_name: >-
          {{ [_automationmetrics_hostname | ansible.containerized_installer.subject_alt_name]
          | union(_automationmetrics_ips | default([])) }}
        mode: '0640'

    - name: Generate a self signed x509 certificate
      community.crypto.x509_certificate:
        path: '{{ automationmetrics_config_path }}/automationmetrics.cert'
        csr_path: '{{ automationmetrics_config_path }}/automationmetrics.csr'
        privatekey_path: '{{ automationmetrics_config_path }}/automationmetrics.key'
        provider: ownca
        ownca_path: '{{ _ca_tls_dir }}/ca.cert'
        ownca_privatekey_path: '{{ _ca_tls_dir }}/ca.key'
        ownca_privatekey_passphrase: '{{ ca_tls_key_passphrase | default(omit) }}'
        force: '{{ _ca_cert_changed | bool }}'
        mode: '0640'
      notify: Restart automation metrics web

- name: Import TLS certificate and key
  when:
    - automationmetrics_tls_cert is defined
    - automationmetrics_tls_key is defined
  block:
    - name: Copy automation metrics TLS certificate
      ansible.builtin.copy:
        src: '{{ automationmetrics_tls_cert }}'
        dest: '{{ automationmetrics_config_path }}/automationmetrics.cert'
        mode: '0640'
        remote_src: '{{ automationmetrics_tls_remote | default(false) }}'
      notify: Restart automation metrics web

    - name: Copy automation metrics TLS key
      ansible.builtin.copy:
        src: '{{ automationmetrics_tls_key }}'
        dest: '{{ automationmetrics_config_path }}/automationmetrics.key'
        mode: '0400'
        remote_src: '{{ automationmetrics_tls_remote | default(false) }}'
      notify: Restart automation metrics web
...
