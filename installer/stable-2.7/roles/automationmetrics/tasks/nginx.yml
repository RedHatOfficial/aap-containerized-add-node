---
- name: Get sysctl net.ipv4.ip_unprivileged_port_start setting
  ansible.builtin.slurp:
    src: /proc/sys/net/ipv4/ip_unprivileged_port_start
  register: _sysctl_cmd

- name: Allow rootless automation metrics container to bind from port 80 onwards
  ansible.posix.sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: '{{ _automationmetrics_ports | union(_sysctl_unprivileged_port_start) | min }}'
    sysctl_set: true
    state: present
    reload: true
  become: true
  vars:
    _sysctl_unprivileged_port_start: '[{{ _sysctl_cmd["content"] | b64decode }}]'
  when: (_automationmetrics_ports | min) < 1024

- name: Create the automation metrics nginx directory
  ansible.builtin.file:
    path: '{{ automationmetrics_nginx_conf_dir }}'
    mode: '0770'
    state: directory

- name: Create the automation metrics nginx configuration
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: '{{ automationmetrics_nginx_conf_dir }}/nginx.conf'
    mode: '0640'
  notify: Restart automation metrics web
...
