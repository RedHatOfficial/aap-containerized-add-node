---
### container
container_log_driver: journald

### common
aap_volumes_dir: '{{ ansible_user_dir }}/aap'
archive_compressed_extension: "tar.gz"
archive_decompressed_extension: "tar"
db_compressed_extension: db.gz
db_decompressed_extension: db

### backup/restore
automationmetrics_use_archive_compression: "{{ use_archive_compression | default(true) }}"
automationmetrics_use_db_compression: "{{ use_db_compression | default(false) }}"
automationmetrics_postgresql_skip_data: '{{ postgresql_skip_data | default(false) }}'

### metrics service
automationmetrics_skip_install: false
automationmetrics_config_path: "{{ aap_volumes_dir }}/automationmetrics/config"
automationmetrics_volume_path: "{{ aap_volumes_dir }}/automationmetrics"
automationmetrics_api_port: 8006
automationmetrics_firewall_zone: public
automationmetrics_gunicorn_workers: '{{ ansible_processor_vcpus | default(4) | int * 2 + 1 }}'
automationmetrics_gunicorn_timeout: '{{ (([(client_request_timeout | int), 10] | max) / 3) | int }}'

### dispatcherd
automationmetrics_dispatcherd_workers: 4
automationmetrics_dispatcherd_timeout: 1200
automationmetrics_dispatcherd_max_tasks: 100

### scheduler
automationmetrics_scheduler_check_interval: 30

### nginx
client_request_timeout: 30
automationmetrics_nginx_conf_dir: '{{ aap_volumes_dir }}/automationmetrics/nginx/etc'
automationmetrics_nginx_disable_https: false
automationmetrics_nginx_disable_hsts: false
automationmetrics_nginx_hsts_max_age: 63072000
automationmetrics_nginx_http_port: 8087
automationmetrics_nginx_https_port: 8450
automationmetrics_nginx_https_protocols:
  - TLSv1.2
  - TLSv1.3
automationmetrics_nginx_client_max_body_size: 5m
automationmetrics_nginx_user_headers: []
automationmetrics_nginx_read_timeout: '{{ (([(client_request_timeout | int), 10] | max) / 2) | int }}'

### TLS
# automationmetrics_tls_cert and automationmetrics_tls_key are optional.
# When not defined, a self-signed certificate is auto-generated using the internal CA.
automationmetrics_tls_remote: false

### database
automationmetrics_pg_port: 5432
automationmetrics_pg_database: metrics_service
automationmetrics_pg_username: metrics_service
automationmetrics_pg_sslmode: prefer
automationmetrics_pg_cert_auth: false

# Controller database (read-only access)
automationmetrics_controller_db: "{{ controller_pg_database | default('awx') }}"
automationmetrics_controller_pg_username: ms_awx_readonly
automationmetrics_controller_read_pg_port: 5432
automationmetrics_controller_read_pg_sslmode: "{{ automationmetrics_pg_sslmode }}"
automationmetrics_controller_read_pg_cert_auth: false
automationmetrics_controller_read_pg_tls_remote: '{{ automationmetrics_tls_remote }}'
# automationmetrics_controller_read_pg_tls_cert and automationmetrics_controller_read_pg_tls_key are optional.
# Required when automationmetrics_controller_read_pg_cert_auth is true.

### security
automationmetrics_secret_key: "{{ lookup('password', '/dev/null length=50 chars=ascii_letters,digits') }}"

### TLS CA
ca_trust_bundle: /etc/pki/tls/certs/ca-bundle.crt

### container requires
automationmetrics_container_requires: []

### extra settings
automationmetrics_extra_settings: []

...
