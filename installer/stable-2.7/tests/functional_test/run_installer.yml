---
- name: Prepare installer host
  hosts: installer
  tasks:
    - name: Generate ssh key
      ansible.builtin.import_role:
        name: containerized_installer
        tasks_from: generate_sshkey.yml

- name: Authorize installer key on all hosts
  hosts: all,!localhost
  tasks:
    - name: Authorize installer key
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        state: present
        key: "{{ lookup('file', 'installer_id_rsa.pub') }}"

- name: Run installer
  hosts: installer
  tasks:
    - name: Install collection
      ansible.builtin.import_role:
        name: containerized_installer
        tasks_from: setup.yml

    - name: Run installer
      ansible.builtin.import_role:
        name: containerized_installer
        tasks_from: install.yml

    - name: Run idempotence installer
      ansible.builtin.import_role:
        name: containerized_installer
        tasks_from: install.yml
      when: run_idempotence_installer | default(True) | bool
...
