---
major_changes:
  - Add offline bundle generation for air-gapped environments (playbooks/generate_bundle.yml)
  - Add roles/generate_bundle for creating self-contained install bundles
  - Support hop nodes, execution nodes, and multi-node chains in offline mode
  - Add BYO TLS certificate support

minor_changes:
  - Add MkDocs Material documentation site
  - Add gitleaks secret scanning to CI and pre-commit

bugfixes:
  - Fix fetch_mesh_material to use mesh-CA.crt instead of ca.cert (includes custom CA)
  - Fix delegation in assert_controller_container with connection ssh
  - Fix preflight controller checks delegation
