---
argument_specs:
  main:
    short_description: Register an execution or hop instance via awx-manage on the controller.
    options:
      aap_add_node_hostname:
        description: Receptor/API hostname for the instance (routable FQDN, not ansible_host IP).
        type: str
        required: true
      aap_add_node_type:
        description: Instance node type.
        type: str
        choices:
          - execution
          - hop
        default: execution
      aap_add_node_listener_port:
        description: Receptor listener port advertised to Controller.
        type: int
        default: 27199
      aap_add_node_peers:
        description: Peer hostnames for register_peers --exact.
        type: list
        elements: str
        default: []
      aap_add_node_controller_container:
        description: Podman name of the controller task container used for awx-manage.
        type: str
        default: automation-controller-task
      aap_add_node_awx_manage_retries:
        description: Retries for podman exec awx-manage commands.
        type: int
        default: 5
      aap_add_node_awx_manage_delay:
        description: Delay in seconds between awx-manage retries.
        type: int
        default: 15
