---
# Register EN/HN the same way the containerized installer does (NOT the K8s Instances API).
# awx-manage via podman exec on the controller task container.
#
# Sequence mirrors automationcontroller/init.yml:
#   provision_instance → add_receptor_address → register_peers → register_queue
# Entry vars validated by meta/argument_specs.yml.

- name: Resolve instance UUID (installer-compatible)
  ansible.builtin.include_tasks: uuid.yml

- name: Register via awx-manage (containerized)
  ansible.builtin.include_tasks: containerized.yml

- name: Discover instance groups from inventory
  ansible.builtin.include_tasks: discover_instance_groups.yml

# Instance Group registration: API mode or awx-manage fallback
# API mode: requires aap_add_node_controller_host + username/password
# awx-manage mode: requires SSH to controller (default)
#
# Collections used (API mode):
#   - ansible.controller.instance_group: Create IGs and assign instances
#
# Note: Gateway tokens (ansible.platform.token) do NOT work with controller API.
# Controller requires basic auth or controller-specific OAuth tokens.

- name: Set API mode fact
  ansible.builtin.set_fact:
    _use_api_mode: >-
      {{
        aap_add_node_controller_host is defined and
        aap_add_node_controller_username is defined and
        aap_add_node_controller_password is defined
      }}

- name: Register to custom instance groups (API mode)
  ansible.builtin.include_tasks: instance_groups_api.yml
  when:
    - aap_add_node_instance_groups | default([]) | length > 0
    - _use_api_mode | bool

- name: Register to custom instance groups (awx-manage mode)
  ansible.builtin.include_tasks: instance_groups.yml
  when:
    - aap_add_node_instance_groups | default([]) | length > 0
    - not (_use_api_mode | bool)

# Optional: Update instance via ansible.controller.instance API
# Enables setting capacity_adjustment, enabled state, etc.
- name: Update instance via API (if credentials available)
  ansible.builtin.include_tasks: instance_api_update.yml
  when: _use_api_mode | bool
