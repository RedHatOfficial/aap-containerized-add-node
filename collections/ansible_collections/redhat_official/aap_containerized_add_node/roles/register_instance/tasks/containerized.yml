---
# Containerized installer: automationcontroller/tasks/init.yml
# Same awx-manage CLI; run inside the live controller task container.
# Use argv lists (not free-form strings) so hostnames/peers cannot split into extra args.

- name: Ensure controller task container is running
  ansible.builtin.include_role:
    name: redhat_official.aap_containerized_add_node.assert_controller_container

# Use override if set, otherwise default to first controller
- name: Register instance via awx-manage
  vars:
    _awx_manage_host: "{{ aap_add_node_controller_target | default(groups['automationcontroller'][0], true) }}"
  block:
    - name: Provision instance
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - "{{ aap_add_node_controller_container }}"
          - awx-manage
          - provision_instance
          - "--hostname={{ aap_add_node_hostname }}"
          - "--uuid={{ aap_add_node_instance_uuid }}"
          - "--node_type={{ aap_add_node_type }}"
      delegate_to: "{{ _awx_manage_host }}"
      become: false
      register: _provision_instance
      changed_when: "'(changed: True)' in _provision_instance.stdout or 'changed: True' in _provision_instance.stdout"
      retries: "{{ aap_add_node_awx_manage_retries }}"
      delay: "{{ aap_add_node_awx_manage_delay }}"
      until: _provision_instance is not failed

    - name: Add receptor address
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - "{{ aap_add_node_controller_container }}"
          - awx-manage
          - add_receptor_address
          - "--instance={{ aap_add_node_hostname }}"
          - "--address={{ aap_add_node_hostname }}"
          - "--port={{ aap_add_node_listener_port }}"
          - --canonical
      delegate_to: "{{ _awx_manage_host }}"
      become: false
      register: _add_receptor_address
      changed_when: "'(changed: True)' in _add_receptor_address.stdout or 'changed: True' in _add_receptor_address.stdout"
      retries: "{{ aap_add_node_awx_manage_retries }}"
      delay: "{{ aap_add_node_awx_manage_delay }}"
      until: _add_receptor_address is not failed

    - name: Register peers
      when: aap_add_node_peers | default([]) | length > 0
      ansible.builtin.command:
        argv: "{{ ['podman', 'exec', aap_add_node_controller_container, 'awx-manage', 'register_peers', aap_add_node_hostname, '--exact'] + (aap_add_node_peers | list) }}"
      delegate_to: "{{ _awx_manage_host }}"
      become: false
      register: _register_peers
      changed_when: not (_register_peers.stdout | regex_search('^0 peer links added'))
      retries: "{{ aap_add_node_awx_manage_retries }}"
      delay: "{{ aap_add_node_awx_manage_delay }}"
      until: _register_peers is not failed

    - name: Register queue default (execution nodes)
      when: aap_add_node_type == 'execution'
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - "{{ aap_add_node_controller_container }}"
          - awx-manage
          - register_queue
          - --queuename=default
          - "--hostname={{ aap_add_node_hostname }}"
      delegate_to: "{{ _awx_manage_host }}"
      become: false
      register: _register_default
      changed_when: "'(changed: True)' in _register_default.stdout or 'changed: True' in _register_default.stdout"
      retries: "{{ aap_add_node_awx_manage_retries }}"
      delay: "{{ aap_add_node_awx_manage_delay }}"
      until: _register_default is not failed

    - name: Register queue executionplane (execution nodes)
      when: aap_add_node_type == 'execution'
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - "{{ aap_add_node_controller_container }}"
          - awx-manage
          - register_queue
          - --queuename=executionplane
          - "--hostname={{ aap_add_node_hostname }}"
      delegate_to: "{{ _awx_manage_host }}"
      become: false
      register: _register_executionplane
      changed_when: "'(changed: True)' in _register_executionplane.stdout or 'changed: True' in _register_executionplane.stdout"
      retries: "{{ aap_add_node_awx_manage_retries }}"
      delay: "{{ aap_add_node_awx_manage_delay }}"
      until: _register_executionplane is not failed
