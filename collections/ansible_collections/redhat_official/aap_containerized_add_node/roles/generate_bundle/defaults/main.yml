---
# Bundle output directory
aap_add_node_bundle_output_dir: "{{ playbook_dir }}/offline-bundles"

# Include container images in bundle (increases size significantly ~500MB)
aap_add_node_bundle_include_images: false

# Bundle archive format: tar.gz (default) or zip
aap_add_node_bundle_format: tar.gz

# Receptor port (matches installer default)
aap_add_node_receptor_port: 27199

# TLS key size
aap_add_node_tls_bits: 4096
