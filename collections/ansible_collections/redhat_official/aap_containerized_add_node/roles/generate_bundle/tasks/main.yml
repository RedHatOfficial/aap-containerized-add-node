---
# Generate self-contained offline join bundle for air-gapped EN provisioning.
#
# Bundle contents:
#   - receptor/tls/          TLS certificates (pre-minted, signed by mesh CA)
#   - receptor/receptor.conf Receptor configuration
#   - receptor/install.yml   Local install playbook
#   - receptor/vars.yml      Variables for install playbook
#   - images/                Container images (optional)
#
# Workflow:
#   1. Run generate_bundle.yml on control host (SSH to controller only)
#   2. Transfer bundle to EN via approved channel
#   3. Run install.yml locally on EN

- name: Validate required variables
  ansible.builtin.assert:
    that:
      - aap_add_node_target_hostname is defined
      - aap_add_node_target_hostname | length > 0
      - aap_add_node_receptor_peers is defined
      - aap_add_node_receptor_peers | length > 0
    fail_msg: |
      Required variables for bundle generation:
        aap_add_node_target_hostname: FQDN of target execution node
        aap_add_node_receptor_peers: List of peer hostnames to connect to

- name: Set bundle paths
  ansible.builtin.set_fact:
    _bundle_name: "offline-bundle-{{ aap_add_node_target_hostname }}-{{ ansible_date_time.date }}"
    _bundle_work_dir: "{{ aap_add_node_bundle_output_dir }}/.work/{{ aap_add_node_target_hostname }}"
    _bundle_final_dir: "{{ aap_add_node_bundle_output_dir }}"

- name: Create bundle working directory
  ansible.builtin.file:
    path: "{{ _bundle_work_dir }}/receptor/tls/ca"
    state: directory
    mode: '0700'

- name: Verify mesh material available
  ansible.builtin.assert:
    that:
      - aap_add_node_mesh_ca_cert is defined
      - aap_add_node_mesh_ca_cert | length > 0
      - aap_add_node_mesh_ca_key is defined
      - aap_add_node_mesh_ca_key | length > 0
    fail_msg: "Mesh CA material not available. Run fetch_mesh_material play first."

- name: Mint TLS certificates for target node
  ansible.builtin.include_tasks: mint_certs.yml

- name: Pre-register instance on controller
  ansible.builtin.include_tasks: pre_register.yml

- name: Generate receptor.conf
  ansible.builtin.template:
    src: receptor.conf.j2
    dest: "{{ _bundle_work_dir }}/receptor/receptor.conf"
    mode: '0640'

- name: Generate install playbook
  ansible.builtin.template:
    src: install.yml.j2
    dest: "{{ _bundle_work_dir }}/install.yml"
    mode: '0644'

- name: Generate install variables
  ansible.builtin.template:
    src: vars.yml.j2
    dest: "{{ _bundle_work_dir }}/vars.yml"
    mode: '0640'

- name: Generate README
  ansible.builtin.template:
    src: README.md.j2
    dest: "{{ _bundle_work_dir }}/README.md"
    mode: '0644'

- name: Include container images (optional)
  ansible.builtin.include_tasks: include_images.yml
  when: aap_add_node_bundle_include_images | bool

- name: Create bundle archive
  ansible.builtin.include_tasks: archive.yml

- name: Clean up working directory
  ansible.builtin.file:
    path: "{{ _bundle_work_dir }}"
    state: absent

- name: Report bundle location
  ansible.builtin.debug:
    msg: |

      ═══════════════════════════════════════════════════════════════════
      OFFLINE BUNDLE GENERATED
      ═══════════════════════════════════════════════════════════════════

      Bundle:   {{ _bundle_final_dir }}/{{ _bundle_name }}.{{ aap_add_node_bundle_format }}
      Target:   {{ aap_add_node_target_hostname }}
      Type:     {{ aap_add_node_target_type | default('execution') }}
      Peers:    {{ aap_add_node_receptor_peers | join(', ') }}

      NEXT STEPS:
      1. Transfer bundle to target node via secure channel
      2. Extract: tar -xzf {{ _bundle_name }}.{{ aap_add_node_bundle_format }}
      3. Read README.md for prerequisites
      4. Run: ansible-playbook -c local install.yml

      ⚠️  SECURITY: Bundle contains TLS private keys. Handle securely.
      ═══════════════════════════════════════════════════════════════════
