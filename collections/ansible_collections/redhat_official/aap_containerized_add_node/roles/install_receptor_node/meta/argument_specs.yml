---
argument_specs:
  main:
    short_description: Install and configure receptor via ansible.containerized_installer.receptor.
    options:
      aap_add_node_bundle_dir:
        description: Per-host minted cert bundle directory from fetch_or_mint_certs.
        type: path
        required: true
      aap_setup_dir:
        description: Path to the extracted containerized-setup tree (collections path).
        type: path
        default: ''
      aap_add_node_type:
        description: Receptor node type.
        type: str
        choices:
          - execution
          - hop
        default: execution
      aap_add_node_bundle_install:
        description: Whether the setup tree includes an offline bundle.
        type: bool
        default: false
      aap_add_node_default_registry_ns_aap:
        description: Registry namespace for AAP images (e.g. ansible-automation-platform-26).
        type: str
        default: ''
      aap_add_node_default_receptor_image:
        description: Receptor image name within the registry namespace.
        type: str
        default: receptor-rhel9:latest
