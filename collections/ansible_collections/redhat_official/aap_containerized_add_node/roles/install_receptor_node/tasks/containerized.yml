---
# Drive ansible.containerized_installer.receptor from the setup tree.
# Host prep already ran installer `common` (tls/extracted, podman, images).

- name: Assert containerized installer collection is importable
  ansible.builtin.command: >
    ansible-galaxy collection list ansible.containerized_installer
  register: _ctr_coll
  changed_when: false
  failed_when: false
  delegate_to: localhost
  become: false

- name: Fail clearly when setup collections are not on the path
  ansible.builtin.assert:
    that:
      - _ctr_coll.rc == 0
      - "'ansible.containerized_installer' in (_ctr_coll.stdout | default(''))"
    fail_msg: >
      ansible.containerized_installer not found. Export
      ANSIBLE_COLLECTIONS_PATH={{ aap_setup_dir }}/collections:$ANSIBLE_COLLECTIONS_PATH
      before running this playbook (same tree as aap_setup_dir).

- name: Place public CA for mesh-CA template (never distribute mesh signing key for receptor TLS mint here)
  ansible.builtin.copy:
    src: "{{ aap_add_node_bundle_dir }}/receptor/tls/ca/mesh-CA.crt"
    dest: "{{ ansible_user_dir }}/aap/tls/ca.cert"
    mode: '0640'

# Installer facts.yml uses routable_hostname|default(ansible_host). When inventory
# sets ansible_host=IP, that becomes the receptor node id and breaks TLS (cert SAN
# is the FQDN). Force the API/cert hostname before include_role.
# installer signing.yml Import block requires BOTH vars defined; private is
# only copied when _receptor_type is control/hybrid, so EN never receives it.
# Signing keys are set only for execution nodes (omit on hop).
- name: Set receptor role vars (installer receptor role + minted certs)
  ansible.builtin.set_fact:
    routable_hostname: "{{ aap_add_node_hostname | default(inventory_hostname) }}"
    _ca_tls_dir: "{{ ansible_user_dir }}/aap/tls"
    _receptor_image: "{{ aap_add_node_receptor_image | default(_computed_image) }}"
    receptor_tls_cert: "{{ aap_add_node_bundle_dir }}/receptor/tls/receptor.crt"
    receptor_tls_key: "{{ aap_add_node_bundle_dir }}/receptor/tls/receptor.key"
    receptor_type: "{{ aap_add_node_type }}"
    receptor_port: "{{ aap_add_node_listener_port | default(27199) }}"
    receptor_peers: "{{ aap_add_node_peers | default([]) }}"
    bundle_install: "{{ aap_add_node_bundle_install | default(false) }}"
    receptor_disable_signing: "{{ aap_add_node_type == 'hop' }}"
    _autoupdate_label: "{{ _label_bundle if (aap_add_node_bundle_install | default(false) | bool) else _label_registry }}"
    receptor_signing_public_key: "{{ (aap_add_node_bundle_dir ~ '/receptor/work_public_key.pem') if aap_add_node_type == 'execution' else omit }}"
    receptor_signing_private_key: "{{ (aap_add_node_bundle_dir ~ '/receptor/work_public_key.pem') if aap_add_node_type == 'execution' else omit }}"
  vars:
    _registry_url: "{{ registry_url | default('registry.redhat.io') }}"
    _registry_ns: "{{ registry_ns_aap | default(aap_add_node_default_registry_ns_aap) | default('ansible-automation-platform-26') }}"
    _receptor_img: "{{ receptor_image | default(aap_add_node_default_receptor_image) | default('receptor-rhel9:latest') }}"
    _computed_image: "{{ _registry_url ~ '/' ~ _registry_ns ~ '/' ~ _receptor_img }}"
    _label_bundle:
      io.containers.autoupdate: local
    _label_registry:
      io.containers.autoupdate: registry
      io.containers.autoupdate.authfile: "{{ ansible_user_dir }}/.config/containers/auth.json"

# receptor.conf.j2 uses peer hostvars[_receptor_hostname] as the TCP dial
# address (not the mesh node id). Prefer a reachable IP when the peer's DNS
# name is a gateway/VIP that does not listen on the receptor port.
- name: Seed receptor dial facts on peer inventory hosts
  ansible.builtin.set_fact:
    _receptor_hostname: "{{ _dial }}"
    _receptor_port: "{{ hostvars[item].receptor_port | default(hostvars[item].listener_port | default(aap_add_node_listener_port | default(27199))) }}"
    _receptor_protocol: "{{ hostvars[item].receptor_protocol | default('tcp') }}"
  delegate_to: "{{ item }}"
  delegate_facts: true
  when: item in hostvars
  loop: "{{ aap_add_node_peers | default([]) }}"
  vars:
    _dial: >-
      {{ hostvars[item].receptor_address
         | default(hostvars[item].ansible_default_ipv4.address
         | default(hostvars[item].ansible_host
         | default(hostvars[item].routable_hostname
         | default(item)))) }}

- name: Install receptor container via setup-tree installer role
  ansible.builtin.include_role:
    name: ansible.containerized_installer.receptor
