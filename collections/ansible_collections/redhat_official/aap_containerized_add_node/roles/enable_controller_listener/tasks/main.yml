---
- name: Skip when disabled
  ansible.builtin.meta: end_host
  when: not (aap_add_node_enable_controller_listener | bool)

- name: Locate receptor.conf
  ansible.builtin.stat:
    path: "{{ ansible_user_dir }}/aap/receptor/etc/receptor.conf"
  register: _receptor_conf

- name: Require receptor.conf on controller
  ansible.builtin.assert:
    that:
      - _receptor_conf.stat.exists
    fail_msg: >
      No receptor.conf under {{ ansible_user_dir }}/aap/receptor/etc —
      is this a containerized controller host?

- name: Check for local-only (no mesh listener)
  ansible.builtin.command: grep -E '^- local-only:' {{ ansible_user_dir }}/aap/receptor/etc/receptor.conf
  register: _local_only
  changed_when: false
  failed_when: false

- name: Check for existing tcp-listener
  ansible.builtin.command: grep -E '^- {{ receptor_protocol }}-listener:' {{ ansible_user_dir }}/aap/receptor/etc/receptor.conf
  register: _has_listener
  changed_when: false
  failed_when: false

- name: Replace local-only with tcp-listener for mesh join
  when:
    - _local_only.rc == 0
    - _has_listener.rc != 0
  block:
    - name: Backup receptor.conf
      ansible.builtin.copy:
        src: "{{ ansible_user_dir }}/aap/receptor/etc/receptor.conf"
        dest: "{{ ansible_user_dir }}/aap/receptor/etc/receptor.conf.bak-add-node"
        remote_src: true
        mode: '0640'

    - name: Swap local-only for tcp-listener
      ansible.builtin.replace:
        path: "{{ ansible_user_dir }}/aap/receptor/etc/receptor.conf"
        regexp: '(?m)^- local-only:\s*$'
        replace: |-
          - {{ receptor_protocol }}-listener:
              port: {{ aap_add_node_listener_port }}
              tls: tls_server

    - name: Open receptor listener port on controller firewall
      become: true
      ansible.posix.firewalld:
        port: "{{ aap_add_node_listener_port }}/tcp"
        permanent: true
        immediate: true
        state: enabled
        zone: "{{ receptor_firewall_zone }}"
      failed_when: false

    - name: Restart receptor user service
      ansible.builtin.systemd:
        name: receptor.service
        scope: user
        state: restarted
