---
argument_specs:
  main:
    short_description: Enable tcp-listener on automationcontroller receptor when local-only.
    options:
      aap_add_node_listener_port:
        description: Receptor listener port for the controller mesh listener.
        type: int
        default: 27199
      aap_add_node_enable_controller_listener:
        description: When false, skip rewriting receptor.conf.
        type: bool
        default: true
      receptor_protocol:
        description: Receptor listener protocol (tcp or udp).
        type: str
        default: tcp
      receptor_firewall_zone:
        description: Firewalld zone for the listener port.
        type: str
        default: public
