---
# Update controller receptor.conf to dial out to new execution nodes
# WARNING: This causes 5-10 second mesh disruption per restart
#
# Use only when:
# - Execution nodes cannot dial out to controller (firewall restriction)
# - Customer accepts maintenance window requirement

- name: Skip when inbound dial not enabled
  ansible.builtin.meta: end_host
  when: not (aap_add_node_enable_controller_peer | default(false) | bool)

- name: Resolve receptor config directory
  ansible.builtin.set_fact:
    aap_add_node_receptor_config_dir: "{{ ansible_user_dir }}/aap/receptor/etc"
  when: aap_add_node_receptor_config_dir | default('') | length == 0

- name: Display disruption warning
  ansible.builtin.debug:
    msg: |
      ========================================
      WARNING: INBOUND DIAL MODE ENABLED
      ========================================
      This will restart receptor on the controller.
      Expect 5-10 seconds mesh disruption.
      Running jobs may fail if mid-execution.
      ========================================

- name: Check tcp-listener exists in receptor.conf
  ansible.builtin.command:
    cmd: grep -q "^- tcp-listener:" "{{ aap_add_node_receptor_config_dir }}/receptor.conf"
  register: _tcp_listener_check
  failed_when: false
  changed_when: false

- name: Fail if tcp-listener not present
  ansible.builtin.fail:
    msg: |
      Controller receptor.conf has no tcp-listener block.
      Inbound dial requires enable_controller_listener to run first.
      Either:
        1. Set aap_add_node_enable_controller_listener=true, or
        2. Manually add a tcp-listener to receptor.conf
  when: _tcp_listener_check.rc != 0

- name: Create backup directory
  ansible.builtin.file:
    path: "{{ playbook_dir }}/backups"
    state: directory
    mode: '0755'
  delegate_to: localhost
  become: false
  run_once: true

- name: Backup controller receptor.conf
  ansible.builtin.fetch:
    src: "{{ aap_add_node_receptor_config_dir }}/receptor.conf"
    dest: "{{ playbook_dir }}/backups/{{ inventory_hostname }}_receptor.conf.{{ ansible_date_time.iso8601_basic_short }}"
    flat: true

- name: Add tcp-peer entries for new nodes
  ansible.builtin.blockinfile:
    path: "{{ aap_add_node_receptor_config_dir }}/receptor.conf"
    marker: "# {mark} ANSIBLE MANAGED - peer {{ item }}"
    insertafter: "^- tcp-listener:"
    block: |
      - tcp-peer:
          address: {{ hostvars[item].routable_hostname | default(item) }}:{{ hostvars[item].receptor_port | default(hostvars[item].listener_port | default(aap_add_node_listener_port | default(27199))) }}
  loop: "{{ groups['aap_add_node_targets'] | default([]) }}"
  register: _receptor_conf_changed
  notify: restart receptor

- name: Force handler execution if config changed
  ansible.builtin.meta: flush_handlers
  when: _receptor_conf_changed.changed
