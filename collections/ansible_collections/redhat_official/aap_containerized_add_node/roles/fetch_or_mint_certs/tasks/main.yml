---
# Mint per-host receptor TLS using mesh CA (ownca). Runs on localhost.
# Produces mesh cert tree under bundles/<hostname>/
# SAN includes receptor node-id OID used by AAP mesh (same as containerized installer).
# Entry vars validated by meta/argument_specs.yml.

- name: Mint receptor TLS bundle
  vars:
    _bundle_dir: "{{ aap_add_node_bundle_root }}/{{ aap_add_node_hostname }}"
  block:
    - name: Create bundle directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0750'
      loop:
        - "{{ _bundle_dir }}/receptor/tls/ca"
        - "{{ _bundle_dir }}/receptor/tls"

    - name: Copy mesh CA certificate into bundle
      ansible.builtin.copy:
        src: "{{ aap_add_node_mesh_ca_cert }}"
        dest: "{{ _bundle_dir }}/receptor/tls/ca/mesh-CA.crt"
        mode: '0640'

    - name: Copy work signing public key into bundle
      ansible.builtin.copy:
        src: "{{ aap_add_node_work_public_key }}"
        dest: "{{ _bundle_dir }}/receptor/work_public_key.pem"
        mode: '0640'
      when:
        - aap_add_node_work_public_key | default('') | length > 0
        - aap_add_node_type | default('execution') == 'execution'

    - name: Generate node private key
      community.crypto.openssl_privatekey:
        path: "{{ _bundle_dir }}/receptor/tls/receptor.key"
        size: "{{ aap_add_node_tls_bits | int }}"
        type: RSA
        # Match containerized_installer receptor/tls.yml (mode: '0400')
        mode: '0400'

    - name: Generate node CSR with receptor node-id SAN OID
      community.crypto.openssl_csr:
        path: "{{ _bundle_dir }}/receptor/tls/receptor.csr"
        privatekey_path: "{{ _bundle_dir }}/receptor/tls/receptor.key"
        common_name: "{{ aap_add_node_hostname }}"
        subject_alt_name: "{{ _sans }}"
        subject_alt_name_critical: false
      vars:
        _sans:
          - "DNS:{{ aap_add_node_hostname }}"
          - "otherName:1.3.6.1.4.1.2312.19.1;UTF8:{{ aap_add_node_hostname }}"

    - name: Sign node certificate with mesh CA
      community.crypto.x509_certificate:
        path: "{{ _bundle_dir }}/receptor/tls/receptor.crt"
        csr_path: "{{ _bundle_dir }}/receptor/tls/receptor.csr"
        ownca_path: "{{ aap_add_node_mesh_ca_cert }}"
        ownca_privatekey_path: "{{ aap_add_node_mesh_ca_key }}"
        provider: ownca
        mode: '0640'

    - name: Expose bundle paths on host
      ansible.builtin.set_fact:
        aap_add_node_bundle_dir: "{{ _bundle_dir }}"
        custom_tls_certfile: "{{ _bundle_dir }}/receptor/tls/receptor.crt"
        custom_tls_keyfile: "{{ _bundle_dir }}/receptor/tls/receptor.key"
        custom_ca_certfile: "{{ _bundle_dir }}/receptor/tls/ca/mesh-CA.crt"
        custom_worksign_public_keyfile: "{{ _bundle_dir }}/receptor/work_public_key.pem"
