---
# Decide whether to skip ansible.containerized_installer.common's offline
# copy/uncompress/podman_load (and online pull) path. The installer has no
# built-in skip; we flip bundle_install/registry_auth/container_pull_images.

- name: Resolve expected EN image refs (same naming as installer images.yml)
  ansible.builtin.set_fact:
    aap_add_node_expected_receptor_image: >-
      {{ _reg }}/{{ _ns }}/{{ receptor_image | default(aap_add_node_default_receptor_image) | default('receptor-rhel9:latest') }}
    aap_add_node_expected_ee_images:
      - "{{ _reg }}/{{ _ns }}/{{ ee_minimal_image | default('ee-minimal-rhel9:latest') }}"
      - "{{ _reg }}/{{ _ns }}/{{ ee_supported_image | default('ee-supported-rhel9:latest') }}"
  vars:
    _reg: "{{ registry_url | default('registry.redhat.io') }}"
    _ns: "{{ registry_ns_aap | default(aap_add_node_default_registry_ns_aap) | default('ansible-automation-platform-26') }}"

- name: Force-skip image load when override set
  ansible.builtin.set_fact:
    aap_add_node_skip_image_load_effective: true
  when: aap_add_node_skip_image_load | bool

- name: Probe whether expected images are already loaded
  when:
    - not (aap_add_node_skip_image_load_effective | default(false) | bool)
    - aap_add_node_skip_image_load_if_present | bool
  block:
    - name: Check execution-plane storage.conf exists
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/aap/containers/storage.conf"
      register: _ee_storage_conf

    - name: Check receptor image in default store
      ansible.builtin.command:
        cmd: podman image exists {{ aap_add_node_expected_receptor_image }}
      register: _receptor_img_exists
      changed_when: false
      failed_when: false

    - name: Check EE images in execution-plane store
      ansible.builtin.command:
        cmd: podman image exists {{ item }}
      environment:
        CONTAINERS_STORAGE_CONF: "{{ ansible_user_dir }}/aap/containers/storage.conf"
      loop: "{{ aap_add_node_expected_ee_images }}"
      register: _ee_img_exists
      changed_when: false
      failed_when: false
      when: _ee_storage_conf.stat.exists | bool

    - name: Auto-skip when all expected images are present
      ansible.builtin.set_fact:
        aap_add_node_skip_image_load_effective: true
      when:
        - _receptor_img_exists.rc | default(1) == 0
        - _ee_storage_conf.stat.exists | bool
        - (_ee_img_exists.results | default([]) | length) == (aap_add_node_expected_ee_images | length)
        - (_ee_img_exists.results | default([]) | selectattr('rc', 'ne', 0) | list | length) == 0

- name: Default skip flag to false when unset
  ansible.builtin.set_fact:
    aap_add_node_skip_image_load_effective: false
  when: aap_add_node_skip_image_load_effective is not defined

- name: Announce image-load skip
  ansible.builtin.debug:
    msg: >-
      Skipping container image copy/extract/import/pull
      (aap_add_node_skip_image_load={{ aap_add_node_skip_image_load | bool }},
      if_present={{ aap_add_node_skip_image_load_if_present | bool }}).
      Expected receptor={{ aap_add_node_expected_receptor_image }}.
  when: aap_add_node_skip_image_load_effective | bool
