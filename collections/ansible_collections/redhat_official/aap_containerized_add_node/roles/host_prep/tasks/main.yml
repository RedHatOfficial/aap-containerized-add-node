---
- name: Preflight — hostname must not be localhost
  ansible.builtin.assert:
    that:
      - ansible_hostname | lower not in ['localhost', 'localhost.localdomain']
      - (aap_add_node_hostname | default(inventory_hostname) | lower) not in ['localhost', 'localhost.localdomain']
    fail_msg: Receptor nodes require a real hostname (not localhost).

- name: Include containerized host preparation
  ansible.builtin.include_tasks: containerized.yml

- name: Optional version skew check against an existing execution node
  ansible.builtin.include_tasks: version_skew.yml
  when:
    - aap_add_node_check_version_skew | bool
    - groups['execution_nodes'] | default([]) | length > 1
