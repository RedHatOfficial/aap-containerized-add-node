---
# Inventory format validation
# P9: receptor_peers format validation
# Uses same parsing logic as discover_new_nodes to catch INI string formats

- name: Validate receptor_peers format for all execution nodes
  ansible.builtin.assert:
    that:
      - _parsed is sequence
      - _parsed is not string
      - not (_bare_hostname_string | bool)
    fail_msg: >-
      Host '{{ item }}': receptor_peers must be a real list.
      INI: receptor_peers='["peer.example.com"]' (JSON array in quotes).
      YAML: receptor_peers: [peer.example.com].
      Do not use receptor_peers=peer… or receptor_peers=['peer…'] (those stay strings).
      Got: {{ _peers_raw | to_json }}
  loop: "{{ groups[aap_add_node_inventory_group] | default([]) }}"
  vars:
    _peers_raw: "{{ hostvars[item].receptor_peers | default(hostvars[item].aap_add_node_peers | default([])) }}"
    _as_yaml: "{{ _peers_raw | string | regex_replace(\"'\", '\"') }}"
    _parsed: "{{ _as_yaml | from_yaml if (_peers_raw is string) else _peers_raw }}"
    _bare_hostname_string: "{{ (_peers_raw is string) and ((_peers_raw | length) > 0) and ((_parsed | default([]) | length) == 0) }}"
