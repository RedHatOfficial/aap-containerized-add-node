---
# Preflight checks for mesh node addition
# Run before any installation work to catch errors early

- name: Skip preflight when disabled
  ansible.builtin.meta: end_host
  when: not (aap_add_node_preflight_enabled | bool)

- name: Run installer-side checks
  ansible.builtin.include_tasks: installer_checks.yml

- name: Run controller checks
  ansible.builtin.include_tasks: controller_checks.yml

- name: Run execution node checks
  ansible.builtin.include_tasks: execution_node_checks.yml
  loop: "{{ groups[aap_add_node_inventory_group] | default([]) }}"
  loop_control:
    loop_var: _target_host

- name: Run inventory format checks
  ansible.builtin.include_tasks: inventory_checks.yml

- name: Validate machine-id uniqueness across execution nodes
  ansible.builtin.include_tasks: machine_id_check.yml

- name: Preflight summary
  ansible.builtin.debug:
    msg: "Preflight checks passed for {{ groups[aap_add_node_inventory_group] | default([]) | length }} execution node(s)"
