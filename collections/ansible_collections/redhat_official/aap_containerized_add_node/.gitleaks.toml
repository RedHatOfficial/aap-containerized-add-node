# Gitleaks configuration
# https://github.com/gitleaks/gitleaks

title = "AAP Containerized Add Node Gitleaks Config"

[extend]
useDefault = true

[allowlist]
description = "Allowlist for AAP collection"
paths = [
    '''\.md$''',
    '''docs/.*''',
    '''examples/.*\.yml$''',
]

# Ignore test/example placeholders
regexes = [
    '''example\.com''',
    '''your-password-here''',
    '''REPLACE_ME''',
]
