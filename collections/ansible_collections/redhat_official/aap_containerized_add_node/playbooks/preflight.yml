---
# Standalone preflight validation for mesh node addition.
#
# Usage:
#   ansible-playbook -i inventory playbooks/preflight.yml \
#     -e aap_setup_dir=/path/to/containerized-setup
#
# This playbook validates all prerequisites without making any changes.
# Run before add_node.yml to ensure a smooth installation during change windows.

- name: Validate setup directory
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: redhat_official.aap_containerized_add_node.validate_setup_dir

- name: Preflight validation for mesh node addition
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: redhat_official.aap_containerized_add_node.preflight

- name: Report preflight results
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Preflight passed
      ansible.builtin.debug:
        msg: |
          ========================================
                    PREFLIGHT PASSED
          ========================================
          All prerequisites validated.
          Ready to run add_node.yml
          ========================================
