---
# Additive EN/HN join for containerized AAP (no full install.yml).
#
# Drop-in under ansible.containerized_installer (see installer-overlay/README.md).
# Design: INSTALLER_PLAN.md in the redhat_official.aap_containerized_add_node repo.
#
#   ansible-playbook -i inventory-growth ansible.containerized_installer.add_execution_nodes
#
# Inventory: receptor_type, receptor_peers='["peer.example.com"]', routable_hostname when ansible_host is an IP.

- name: Discover execution_nodes missing from Controller
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Discover net-new / incomplete EN and HN hosts
      ansible.builtin.import_role:
        name: add_execution_nodes
        tasks_from: discover.yml

- name: Enable mesh listener on automationcontroller when local-only
  hosts: "{{ groups['automationcontroller'][0] | default('automationcontroller') }}"
  gather_facts: true
  become: false
  tasks:
    - name: Flip local-only to tcp-listener if needed
      ansible.builtin.import_role:
        name: add_execution_nodes
        tasks_from: enable_controller_listener.yml
      when:
        - (groups['execution_nodes_new'] | default([])) | length > 0

- name: Host preparation on new nodes only
  hosts: execution_nodes_new
  gather_facts: true
  become: false
  any_errors_fatal: true
  tasks:
    - name: Nothing to prepare
      ansible.builtin.debug:
        msg: No hosts in execution_nodes_new; skipping common/receptor/register.
      when: (groups['execution_nodes_new'] | default([])) | length == 0
      run_once: true

    - name: Run containerized installer common on new hosts
      ansible.builtin.import_role:
        name: common
      when: (groups['execution_nodes_new'] | default([])) | length > 0

- name: Install receptor on new nodes only
  hosts: execution_nodes_new
  gather_facts: true
  become: false
  any_errors_fatal: true
  tasks:
    - name: Run containerized installer receptor on new hosts
      ansible.builtin.import_role:
        name: receptor
      when: (groups['execution_nodes_new'] | default([])) | length > 0

- name: Register new instances via awx-manage (no deprovision)
  hosts: "{{ groups['automationcontroller'][0] | default('automationcontroller') }}"
  gather_facts: false
  become: false
  tasks:
    - name: Register EN/HN instances for this growth run
      ansible.builtin.import_role:
        name: automationcontroller
        tasks_from: register_execution_nodes.yml
      when: (groups['execution_nodes_new'] | default([])) | length > 0

- name: Verify new instances appear in list_instances
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Verify join
      ansible.builtin.import_role:
        name: add_execution_nodes
        tasks_from: verify.yml
      when: (groups['execution_nodes_new'] | default([])) | length > 0
