---
# Optional overrides for the control host — do NOT put these in the installer inventory.
#
# Typical run (no secrets file required if defaults are fine):
#   ansible-playbook playbooks/add_node.yml \
#     -i /path/to/aap-setup/inventory \
#     -e aap_setup_dir=/path/to/aap-setup
#
# Discover / register / verify use awx-manage on the controller (SSH as the
# install user). No gateway token needed.
#
# Peering (most important): set per host in the *installer inventory*, not here.
#   New node dials out (default / recommended):
#     receptor_peers='["controller.or.hop.example.com"]'   # INI: real JSON list
#   Controllers do not dial new nodes unless you opt in (see below).

# ---------------------------------------------------------------------------
# Usually leave unset — collection defaults are correct for outbound dial.
# ---------------------------------------------------------------------------

# Optional: mesh CA / work key paths (otherwise fetched from automationcontroller)
# aap_add_node_mesh_ca_cert: /secure/mesh-CA.crt
# aap_add_node_mesh_ca_key: /secure/mesh-CA.key
# aap_add_node_work_public_key: /secure/work_public_key.pem

# Opt-in inbound dial (controller → new node). Causes brief mesh disruption.
# Default is false. Prefer inventory receptor_peers on the new node instead.
# aap_add_node_enable_controller_peer: true

# Opt out of AIO local-only → tcp-listener on the controller. Default is true
# (needed so new nodes can dial an AIO controller). Safe no-op if already listening.
# aap_add_node_enable_controller_listener: false

# Lab re-runs: skip bundle image copy/extract/import when images already loaded
# aap_add_node_skip_image_load: true

# Optional: fail host_prep when receptor image tag differs from an existing EN
# aap_add_node_fail_on_version_skew: true
