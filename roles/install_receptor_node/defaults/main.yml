---
# Drive ansible.containerized_installer.receptor from aap_setup_dir

receptor_user: awx
receptor_group: awx
receptor_verify: true
receptor_tls: true
receptor_protocol: tcp
receptor_listener: true
receptor_port: "{{ aap_add_node_listener_port | default(27199) }}"
aap_add_node_type: execution
# aap_add_node_bundle_dir is required (see meta/argument_specs.yml); no empty default.
aap_add_node_bundle_install: false
aap_setup_dir: ''
aap_add_node_default_registry_ns_aap: ''
aap_add_node_default_receptor_image: receptor-rhel9:latest
