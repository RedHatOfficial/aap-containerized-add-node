---
# Run awx-manage list_instances on the first automationcontroller host.
# Sets:
#   aap_add_node_list_instances_stdout
#   aap_add_node_existing_hostnames  (unique hostnames from the listing)

- name: Ensure controller task container is running
  ansible.builtin.include_role:
    name: redhat_official.aap_containerized_add_node.assert_controller_container

- name: List instances via awx-manage (containerized)
  # Disable TTY colors — awx-manage otherwise prefixes hostnames with ANSI
  # (e.g. \x1b[92m), which breaks discovery/verify hostname matching.
  # Use raw SSH command to avoid Ansible delegate_to environment pollution
  # when control host is macOS with podman-machine configured.
  ansible.builtin.shell: |
    ssh -o StrictHostKeyChecking=no -o BatchMode=yes \
      {{ hostvars[_awx_manage_host].ansible_ssh_common_args | default('') }} \
      {{ hostvars[_awx_manage_host].ansible_user | default(ansible_user_id) }}@{{ _awx_manage_host }} \
      'podman exec -e NO_COLOR=1 -e TERM=dumb -e PY_COLORS=0 {{ aap_add_node_controller_container }} awx-manage list_instances'
  args:
    executable: /bin/bash
  vars:
    # Use override if set, otherwise default to first controller.
    _awx_manage_host: "{{ aap_add_node_controller_target | default(groups['automationcontroller'][0], true) }}"
  delegate_to: localhost
  become: false
  register: _list_instances_ctr
  changed_when: false

- name: Publish list_instances stdout and parsed hostnames
  ansible.builtin.set_fact:
    aap_add_node_list_instances_stdout: "{{ _stdout }}"
    aap_add_node_existing_hostnames: "{{ (_stdout | regex_findall(_hostname_re) | default([], true)) | unique | list }}"
    # Skip on re-run only when a non-DISABLED line has heartbeat= (mesh healthy).
    # Provisioned-but-incomplete nodes (capacity=0, no heartbeat) stay eligible.
    aap_add_node_ready_hostnames: "{{ (_stdout | regex_findall(_ready_re) | default([], true)) | unique | list }}"
  vars:
    # Strip any remaining ANSI CSI sequences before parsing hostnames.
    _stdout: "{{ _list_instances_ctr.stdout | regex_replace('\\x1b\\[[0-9;]*[A-Za-z]', '') }}"
    # awx-manage list_instances line shapes (indented; fields vary by node_type):
    #     host.example.com capacity=16 node_type=execution heartbeat=2024-08-06T12:00:00...
    #     [DISABLED] host2.example.com capacity=0 node_type=control
    #     hop.example.com node_type=hop heartbeat=2024-08-06T12:00:00...
    # _hostname_re: capture hostname on any instance line (optional [DISABLED], optional capacity=).
    # _ready_re: capture hostname only when line is not DISABLED and includes heartbeat=.
    _hostname_re: '(?m)^\s*(?:\[DISABLED\]\s+)?(\S+)\s+(?:capacity=\d+\s+)?node_type='
    _ready_re: '(?m)^\s+(?!\[DISABLED\])(\S+)\s+.*\bheartbeat='
