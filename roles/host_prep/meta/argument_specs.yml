---
argument_specs:
  main:
    short_description: Prepare a new node with ansible.containerized_installer.common.
    options:
      aap_setup_dir:
        description: Path to the extracted containerized-setup tree.
        type: path
        required: true
      aap_add_node_mesh_ca_cert:
        description: >-
          Path to the cluster mesh/platform CA certificate (public cert only).
          Pre-seeded to ~/aap/tls/ca.cert before installer common runs.
        type: path
        required: true
      aap_add_node_type:
        description: Receptor node type.
        type: str
        choices:
          - execution
          - hop
        default: execution
      aap_add_node_bundle_install:
        description: Whether the setup tree includes an offline bundle.
        type: bool
        default: false
      aap_add_node_listener_port:
        description: Default receptor listener port.
        type: int
        default: 27199
      aap_add_node_skip_image_load:
        description: Force-skip installer image copy/load and registry pull.
        type: bool
        default: false
      aap_add_node_skip_image_load_if_present:
        description: Auto-skip image load when receptor and EE images already exist.
        type: bool
        default: true
      aap_add_node_check_version_skew:
        description: Soft-check image skew against an existing execution node.
        type: bool
        default: true
      aap_add_node_fail_on_version_skew:
        description: Fail the play when version skew is detected.
        type: bool
        default: false
