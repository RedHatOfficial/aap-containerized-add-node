---
# aap_add_node_hostname is required (see meta/argument_specs.yml); no empty default.
aap_add_node_type: execution
aap_add_node_listener_port: 27199
aap_add_node_peers: []
# Run awx-manage inside this controller container (same CLI as installer init)
aap_add_node_controller_container: automation-controller-task
# Retries for podman exec awx-manage (installer init.yml uses similar until/retries)
aap_add_node_awx_manage_retries: 5
aap_add_node_awx_manage_delay: 15
# Custom instance groups to add node to (created if not exist)
aap_add_node_instance_groups: []

# API mode for instance groups (optional - falls back to awx-manage if not set)
# Uses ansible.controller.instance_group module with basic auth
#
# Note: Gateway tokens (ansible.platform) do NOT work with controller API.
# Controller API requires basic auth or controller-specific OAuth tokens.
#
# aap_add_node_controller_host: "https://controller.example.com"
# aap_add_node_controller_username: "admin"
# aap_add_node_controller_password: "password"
# aap_add_node_validate_certs: true
# aap_add_node_no_log: true  # Hide credentials in output

# Instance settings (applied via ansible.controller.instance if API mode)
# aap_add_node_enabled: true                   # Enable instance
# aap_add_node_capacity_adjustment: 1.0        # 0.0-1.0 capacity multiplier
# aap_add_node_managed_by_policy: true         # Auto-assign to instance groups
