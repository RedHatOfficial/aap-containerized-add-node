---
# Inventory format validation
# P9: receptor_peers format validation

- name: Validate receptor_peers format for all execution nodes
  ansible.builtin.assert:
    that:
      - _peers is sequence
      - _peers is not string
    fail_msg: >-
      Host '{{ item }}': receptor_peers must be a list.
      INI: receptor_peers='["peer.example.com"]' (JSON array in quotes).
      YAML: receptor_peers: [peer.example.com].
      Got: {{ _peers | type_debug }} = {{ _peers }}
  loop: "{{ groups[aap_add_node_inventory_group] | default([]) }}"
  vars:
    _peers: "{{ hostvars[item].receptor_peers | default(hostvars[item].aap_add_node_peers | default([])) }}"
  when: (_peers | length > 0) or (_peers is string and _peers | length > 0)
