---
# Controller accessibility and state checks
# Reuses existing assert_controller_container role

- name: Validate controller access and container state
  ansible.builtin.include_role:
    name: assert_controller_container

# Check AIO local-only status (disruption warning).
# Preflight runs with gather_facts: false on localhost; pull user facts on the
# controller so ansible_user_dir is defined for the delegated slurp.
- name: Gather controller user facts for receptor path
  vars:
    _ctrl_host: "{{ aap_add_node_controller_target | default(groups['automationcontroller'][0], true) }}"
    _ctrl_connection: "{{ hostvars[_ctrl_host].ansible_connection | default('ssh') }}"
  ansible.builtin.setup:
    gather_subset:
      - user
  delegate_to: "{{ _ctrl_host }}"
  connection: "{{ _ctrl_connection }}"
  delegate_facts: true

- name: Get controller receptor.conf
  vars:
    _ctrl_host: "{{ aap_add_node_controller_target | default(groups['automationcontroller'][0], true) }}"
    _ctrl_connection: "{{ hostvars[_ctrl_host].ansible_connection | default('ssh') }}"
  ansible.builtin.slurp:
    src: "{{ hostvars[_ctrl_host].ansible_user_dir }}/aap/receptor/etc/receptor.conf"
  delegate_to: "{{ _ctrl_host }}"
  connection: "{{ _ctrl_connection }}"
  become: false
  register: _receptor_conf_raw
  ignore_errors: true

- name: Parse receptor.conf for local-only
  ansible.builtin.set_fact:
    _controller_is_local_only: "{{ 'local-only' in (_receptor_conf_raw.content | b64decode) }}"
  when: _receptor_conf_raw is succeeded

- name: Warn about AIO disruption if local-only
  ansible.builtin.debug:
    msg: |
      ========================================
               AIO DISRUPTION WARNING
      ========================================
      Controller is configured with 'local-only' receptor.

      Adding execution nodes will:
      - Enable tcp-listener on controller
      - Restart controller receptor service
      - Cause 5-10 SECOND MESH DISRUPTION
      - Running jobs may fail mid-execution

      Recommendation: Schedule during maintenance window.
      ========================================
  when:
    - _controller_is_local_only | default(false) | bool
