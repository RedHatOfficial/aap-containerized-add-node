---
# Pre-register instance on controller so it appears in Controller UI
# and heartbeat connects when receptor starts on the EN.
#
# Same awx-manage commands as register_instance role but:
#   - Uses target_hostname (bundle target) not inventory host
#   - UUID generated from target machine-id placeholder or random

- name: Ensure controller task container is running
  ansible.builtin.include_role:
    name: assert_controller_container

- name: Generate instance UUID for bundle target
  ansible.builtin.set_fact:
    _bundle_instance_uuid: "{{ 9999999999999 | random | to_uuid }}"

- name: Pre-register instance via awx-manage
  vars:
    _awx_manage_host: "{{ aap_add_node_controller_target | default(groups['automationcontroller'][0], true) }}"
    _delegate_connection: "{{ hostvars[_awx_manage_host].ansible_connection | default('ssh') }}"
    _node_type: "{{ aap_add_node_target_type | default('execution') }}"
  block:
    - name: Provision instance
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - "{{ aap_add_node_controller_container }}"
          - awx-manage
          - provision_instance
          - "--hostname={{ aap_add_node_target_hostname }}"
          - "--uuid={{ _bundle_instance_uuid }}"
          - "--node_type={{ _node_type }}"
      delegate_to: "{{ _awx_manage_host }}"
      connection: "{{ _delegate_connection }}"
      become: false
      register: _provision_instance
      changed_when: "'(changed: True)' in _provision_instance.stdout"

    - name: Add receptor address
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - "{{ aap_add_node_controller_container }}"
          - awx-manage
          - add_receptor_address
          - "--instance={{ aap_add_node_target_hostname }}"
          - "--address={{ aap_add_node_target_hostname }}"
          - "--port={{ aap_add_node_receptor_port }}"
          - --canonical
      delegate_to: "{{ _awx_manage_host }}"
      connection: "{{ _delegate_connection }}"
      become: false
      register: _add_receptor_address
      changed_when: "'(changed: True)' in _add_receptor_address.stdout"

    - name: Register peers
      ansible.builtin.command:
        argv: "{{ ['podman', 'exec', aap_add_node_controller_container, 'awx-manage', 'register_peers', aap_add_node_target_hostname, '--exact'] + (aap_add_node_receptor_peers | list) }}"
      delegate_to: "{{ _awx_manage_host }}"
      connection: "{{ _delegate_connection }}"
      become: false
      register: _register_peers
      changed_when: not (_register_peers.stdout | regex_search('^0 peer links added'))

    - name: Register queue default (execution nodes)
      when: _node_type == 'execution'
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - "{{ aap_add_node_controller_container }}"
          - awx-manage
          - register_queue
          - --queuename=default
          - "--hostname={{ aap_add_node_target_hostname }}"
      delegate_to: "{{ _awx_manage_host }}"
      connection: "{{ _delegate_connection }}"
      become: false
      register: _register_default
      changed_when: "'(changed: True)' in _register_default.stdout"

    - name: Register queue executionplane (execution nodes)
      when: _node_type == 'execution'
      ansible.builtin.command:
        argv:
          - podman
          - exec
          - "{{ aap_add_node_controller_container }}"
          - awx-manage
          - register_queue
          - --queuename=executionplane
          - "--hostname={{ aap_add_node_target_hostname }}"
      delegate_to: "{{ _awx_manage_host }}"
      connection: "{{ _delegate_connection }}"
      become: false
      register: _register_executionplane
      changed_when: "'(changed: True)' in _register_executionplane.stdout"

- name: Save UUID to bundle vars
  ansible.builtin.set_fact:
    _bundle_vars:
      instance_uuid: "{{ _bundle_instance_uuid }}"
      target_hostname: "{{ aap_add_node_target_hostname }}"
      target_type: "{{ aap_add_node_target_type | default('execution') }}"
      receptor_peers: "{{ aap_add_node_receptor_peers }}"
      receptor_port: "{{ aap_add_node_receptor_port }}"
