---
argument_specs:
  main:
    short_description: Diff inventory execution/hop hosts against Controller ready instances.
    options:
      aap_add_node_inventory_group:
        description: Inventory group holding execution/hop node candidates.
        type: str
        default: execution_nodes
      aap_add_node_target_group:
        description: Dynamic group name created for hosts that need joining.
        type: str
        default: aap_add_node_targets
      aap_add_node_listener_port:
        description: Default receptor listener port applied to new hosts.
        type: int
        default: 27199
